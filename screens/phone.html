<!-- PHONE -->
<div class="screen" id="screen-phone">
    <div class="nav-bar" style="background:#1a1a1e">
        <button class="nav-btn" onclick="nav('screen-home')">
            <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span class="nav-title" style="color:#fff" id="phoneNavTitle" data-i18n="phone">Phone</span>
        <div class="nav-group-right" id="phoneNavRight" style="display:none">
            <button class="nav-btn" onclick="regeneratePhone()" title="Regenerate">
                <svg viewBox="0 0 20 20">
                    <path d="M14.5 3.5l1 3.5h-3.5" stroke="#fff" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5.5 16.5l-1-3.5h3.5" stroke="#fff" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M15 7a7 7 0 01-1 9.5M5 13a7 7 0 011-9.5" stroke="#fff" fill="none" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="nav-btn" onclick="showPhoneCharSelect()">
                <svg viewBox="0 0 20 20">
                    <circle cx="10" cy="6" r="3" stroke="#fff" fill="none" stroke-width="1.5"/>
                    <path d="M4 18c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#fff" fill="none" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Character Select -->
    <div id="phoneCharSelect" style="flex:1;overflow-y:auto;background:linear-gradient(180deg,#1a1a1e 0%,#2c2c30 100%);padding:20px 16px">
        <div style="text-align:center;padding:30px 0 28px">
            <div style="width:72px;height:72px;margin:0 auto 16px;background:rgba(255,255,255,.05);border-radius:20px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.06)">
                <svg viewBox="0 0 32 32" style="width:36px;height:36px;stroke:rgba(255,255,255,.25);fill:none;stroke-width:1.2">
                    <rect x="8" y="3" width="16" height="26" rx="3"/>
                    <path d="M14 6h4"/>
                    <circle cx="16" cy="25" r="1.5"/>
                    <path d="M8 8h16M8 23h16"/>
                </svg>
            </div>
            <div style="color:#fff;font-size:18px;font-weight:600;margin-bottom:6px">查看谁的手机？</div>
            <div style="color:rgba(255,255,255,.4);font-size:13px">AI 会根据角色性格生成独特桌面</div>
        </div>
        <div id="phoneCharList"></div>
    </div>

    <!-- Phone Frame -->
    <div id="phoneFrameWrap" style="display:none;flex:1;overflow-y:auto">
        <div class="phone-frame" id="phoneFrame">
            <div class="phone-statusbar">
                <div class="phone-statusbar-left">
                    <svg viewBox="0 0 14 14"><path d="M1 10l3-6h6l3 6"/><path d="M3 10h8"/></svg>
                    <span>LTE</span>
                </div>
                <div class="phone-statusbar-right">
                    <svg viewBox="0 0 14 14"><path d="M1 4h2v8H1zM5 2h2v10H5zM9 5h2v7H9zM13 7h0"/></svg>
                    <svg viewBox="0 0 14 14"><rect x="1" y="4" width="10" height="7" rx="1"/><path d="M12 6.5v2"/></svg>
                    <span>85%</span>
                </div>
            </div>

            <div class="phone-time-display">
                <div class="ptd-time" id="phoneTime">09:41</div>
                <div class="ptd-date" id="phoneDate">Monday, January 1</div>
            </div>

            <div style="text-align:center;padding:0 0 20px">
                <span style="display:inline-block;padding:4px 14px;background:rgba(255,255,255,.06);border-radius:20px;color:rgba(255,255,255,.4);font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;border:1px solid rgba(255,255,255,.06)" id="phoneOwnerName"></span>
            </div>

            <div class="phone-app-grid" id="phoneAppGrid"></div>

            <div class="phone-dock" id="phoneDock"></div>

            <div class="phone-home-bar"></div>
        </div>

        <!-- App Page (dynamically populated) -->
        <div class="phone-app-page" id="phoneAppPage" style="display:none"></div>
    </div>

    <!-- Folder Overlay -->
    <div class="phone-folder-overlay" id="phoneFolderOverlay" onclick="closePhoneFolder()">
        <div class="phone-folder-popup" onclick="event.stopPropagation()">
            <div class="phone-folder-popup-header">
                <div class="phone-folder-popup-title" id="phoneFolderTitle">Folder</div>
                <button class="phone-folder-close-btn" onclick="closePhoneFolder()" aria-label="Close folder">
                    <svg viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="phone-folder-popup-grid" id="phoneFolderGrid"></div>
        </div>
    </div>
</div>

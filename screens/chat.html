<!-- CHAT -->
<div class="screen" id="screen-chat">

    <div class="chat-header" id="chatHeaderNormal">
        <button class="ch-back" onclick="nav('screen-imessage')">
            <svg viewBox="0 0 22 22"><path d="M14 4l-8 7 8 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="ch-center" onclick="openHeartVoicePanel()">
            <div class="ch-avatar" id="chatAvatar"></div>
            <span class="ch-name" id="chatName"></span>
            <span class="ch-notes" id="chatNotes"></span>
        </div>
        <button class="ch-edit" onclick="toggleChatMenu(event)">
            <svg viewBox="0 0 22 22">
                <circle cx="11" cy="5"  r="1.5" fill="#1d1d1f" stroke="none"/>
                <circle cx="11" cy="11" r="1.5" fill="#1d1d1f" stroke="none"/>
                <circle cx="11" cy="17" r="1.5" fill="#1d1d1f" stroke="none"/>
            </svg>
        </button>
    </div>

    <div class="bubble-action-bar" id="bubbleActionBar">
        <button class="bab-close" onclick="exitMultiSelect()">
            <svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke-linecap="round"/></svg>
        </button>
        <span class="bab-count" id="babCount">0</span>
        <button class="bab-btn" onclick="bookmarkSelected()">
            <svg viewBox="0 0 18 18"><path d="M4 2h10a1 1 0 011 1v14l-6-3-6 3V3a1 1 0 011-1z"/></svg>
            <span>收藏</span>
        </button>
        <button class="bab-btn danger" onclick="deleteSelected()">
            <svg viewBox="0 0 18 18"><path d="M3 5h12M7 5V4a1 1 0 011-1h2a1 1 0 011 1v1M5 5v10a1 1 0 001 1h6a1 1 0 001-1V5"/></svg>
            <span>删除</span>
        </button>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="bubble-menu-overlay" id="bubbleMenuOverlay" onclick="closeBubbleMenu()"></div>
    <div class="bubble-menu" id="bubbleMenu"></div>

    <div class="chat-menu-overlay" id="chatMenuOverlay" onclick="closeChatMenu()"></div>
    <!-- ★ 静态菜单项：不再依赖 JS innerHTML -->
<div class="chat-menu" id="chatMenu">
    <div class="chat-menu-item" onclick="closeChatMenu();nav('screen-memory')">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M10 2a6 6 0 00-6 6c0 2.5 1.5 4.5 3 5.5V16a1 1 0 001 1h4a1 1 0 001-1v-2.5c1.5-1 3-3 3-5.5a6 6 0 00-6-6z"/>
            <path d="M8 19h4"/>
        </svg>
        <span>记忆设置</span>
    </div>
    <div class="chat-menu-item" onclick="closeChatMenu();openChatSettings()">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="10" cy="10" r="3"/>
            <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.93 4.93l1.41 1.41M13.66 13.66l1.41 1.41M4.93 15.07l1.41-1.41M13.66 6.34l1.41-1.41"/>
        </svg>
        <span>聊天设置</span>
    </div>
    <div class="chat-menu-item" onclick="closeChatMenu();editCharFromChat()">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="10" cy="6" r="3.5"/>
            <path d="M3.5 18c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/>
        </svg>
        <span>角色设置</span>
    </div>
    <div class="chat-menu-item" onclick="closeChatMenu();nav('screen-bookmarks')">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M5 3h10a1 1 0 011 1v13l-6-3.5L4 17V4a1 1 0 011-1z"/>
        </svg>
        <span>信息收藏</span>
    </div>
    <div class="chat-menu-item chat-menu-group-item" id="chatMenuGroupItem"
         onclick="closeChatMenu();openGroupManagePanel()" style="display:none">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="7.5" cy="6" r="2.5"/>
            <path d="M2 16c0-3 2.2-5 5.5-5s5.5 2 5.5 5"/>
            <circle cx="14.5" cy="7" r="2"/>
            <path d="M14.5 12c2 0 3.5 1.2 3.5 3"/>
        </svg>
        <span>群管理</span>
    </div>
</div>


    <div class="sticker-panel" id="stickerPanel">
        <div class="sticker-panel-header">
            <span>表情包</span>
            <div style="display:flex;gap:8px">
                <button onclick="toggleStickerManage()" id="stickerManageBtn">管理</button>
                <button onclick="document.getElementById('stickerImportInput').click()">+</button>
                <input type="file" id="stickerImportInput" accept="image/*" multiple onchange="importStickersFromFile(this)" style="display:none"/>
                <button onclick="closeStickerPanel()">
                    <svg viewBox="0 0 14 14" style="width:12px;height:12px"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
                </button>
            </div>
        </div>
        <div class="sticker-grid" id="stickerGrid"></div>
    </div>

    <div class="chat-quote-bar" id="chatQuoteBar">
        <div class="cqb-line"></div>
        <div class="cqb-text" id="cqbText"></div>
        <button class="cqb-close" onclick="clearQuote()">
            <svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke-linecap="round"/></svg>
        </button>
    </div>

    <div class="chat-input-bar">
        <button class="chat-btn" onclick="togglePlusMenu()">
            <svg viewBox="0 0 22 22"><path d="M11 4v14M4 11h14" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="chat-btn respond-btn" onclick="triggerResponse()" id="respondBtn">
            <svg viewBox="0 0 22 22">
                <path d="M4 18V8a2 2 0 012-2h6l4 4v8a2 2 0 01-2 2H6a2 2 0 01-2-2z"/>
                <path d="M12 6v4h4"/>
                <path d="M8 13h6M8 16h4"/>
            </svg>
        </button>
        <div class="chat-input-wrap">
            <textarea id="chatInput" placeholder="iMessage" rows="1" oninput="autoGrow(this)"></textarea>
        </div>
        <button class="chat-send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 20 20">
                <path d="M3.5 10L16 3.5 12.5 17l-3-5.5z" stroke-linejoin="round"/>
                <path d="M16 3.5L9.5 11.5" stroke-linecap="round"/>
            </svg>
        </button>
    </div>

    <div class="plus-menu-overlay" id="plusMenuOverlay" onclick="closePlusMenu()"></div>
    <div class="plus-menu" id="plusMenu">
        <div class="plus-menu-item" onclick="openCallModal()">
            <svg viewBox="0 0 22 22"><path d="M6.6 3H4.5A1.5 1.5 0 003 4.5c0 8.284 6.716 15 15 15a1.5 1.5 0 001.5-1.5v-2.1a1.5 1.5 0 00-1.05-1.43l-3.15-.9a1.5 1.5 0 00-1.47.37l-1.07 1.07A12.04 12.04 0 017.55 9.84l1.07-1.07a1.5 1.5 0 00.37-1.47l-.9-3.15A1.5 1.5 0 006.66 3z"/></svg>
            <span>电话</span>
        </div>
        <div class="plus-menu-item" onclick="openReturnConfirm()">
            <svg viewBox="0 0 22 22"><path d="M4 8l4-4m0 0L4 8m4-4v8a4 4 0 004 4h4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            <span>重回</span>
        </div>
        <div class="plus-menu-item" onclick="openVoiceModal()">
            <svg viewBox="0 0 22 22"><rect x="8" y="2" width="6" height="12" rx="3"/><path d="M4 10a7 7 0 0014 0"/><path d="M11 17v3"/></svg>
            <span>语音</span>
        </div>
        <div class="plus-menu-item" onclick="openStickerPanel()">
            <svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="9"/><circle cx="8" cy="9" r="1" fill="#1d1d1f" stroke="none"/><circle cx="14" cy="9" r="1" fill="#1d1d1f" stroke="none"/><path d="M7 14c1.5 2 5.5 2 7 0"/></svg>
            <span>表情包</span>
        </div>
        <div class="plus-menu-item" onclick="openTransferModal()">
            <svg viewBox="0 0 22 22"><rect x="2" y="5" width="18" height="14" rx="2"/><path d="M2 9h18"/><path d="M6 15h4"/></svg>
            <span>转账</span>
        </div>
        <div class="plus-menu-item" onclick="openImageModal()">
            <svg viewBox="0 0 22 22"><rect x="3" y="3" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="2"/><path d="M3 15l4-4 3 3 4-5 5 6"/></svg>
            <span>图片</span>
        </div>
    </div>

    <!-- 电话模态框 -->
    <div class="modal-overlay center-modal-overlay" id="callModal" onclick="if(event.target===this)closeModal('callModal')">
        <div class="modal call-modal">
            <div class="modal-header">
                <span>选择通话方式</span>
                <button class="modal-close" onclick="closeModal('callModal')">
                    <svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke="#3a3a3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
                </button>
            </div>
            <div class="call-options">
                <button class="call-option-btn" onclick="startCall('voice')">
                    <svg viewBox="0 0 40 40" class="call-option-icon"><path d="M12.6 8H9.5A2.5 2.5 0 007 10.5c0 10.77 8.73 19.5 19.5 19.5a2.5 2.5 0 002.5-2.5v-3.1a2.5 2.5 0 00-1.75-2.38l-4.2-1.2a2.5 2.5 0 00-2.45.62l-1.42 1.42A16.06 16.06 0 0112.12 15.8l1.42-1.42a2.5 2.5 0 00.62-2.45l-1.2-4.2A2.5 2.5 0 0012.6 8z" stroke="#3a3a3c" stroke-width="1.5" fill="none"/></svg>
                    <span>语音通话</span>
                </button>
                <button class="call-option-btn" onclick="startCall('video')">
                    <svg viewBox="0 0 40 40" class="call-option-icon"><rect x="4" y="10" width="21" height="16" rx="3" stroke="#3a3a3c" stroke-width="1.5" fill="none"/><path d="M25 15l9-4v18l-9-4z" stroke="#3a3a3c" stroke-width="1.5" stroke-linejoin="round" fill="none"/></svg>
                    <span>视频通话</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 重回确认模态框 -->
    <div class="modal-overlay center-modal-overlay" id="returnConfirmModal" onclick="if(event.target===this)closeModal('returnConfirmModal')">
        <div class="modal return-confirm-modal">
            <div class="modal-header">
                <span>重回</span>
                <button class="modal-close" onclick="closeModal('returnConfirmModal')">
                    <svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke="#3a3a3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
                </button>
            </div>
            <div class="return-confirm-body">
                <svg viewBox="0 0 48 48" class="return-confirm-icon"><path d="M8 16l8-8m0 0L8 16m8-8v16a8 8 0 008 8h8" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                <p class="return-confirm-text">将删除最后一条AI回复并重新生成，是否继续？</p>
            </div>
            <div class="return-confirm-actions">
                <button class="return-cancel-btn" onclick="closeModal('returnConfirmModal')">取消</button>
                <button class="return-ok-btn" onclick="confirmReturn()">确认</button>
            </div>
        </div>
    </div>

    <!-- 心声面板 -->
    <div class="modal-overlay center-modal-overlay" id="heartVoiceOverlay" onclick="if(event.target===this)closeHeartVoicePanel()">
        <div class="heart-voice-card" id="heartVoicePanel">
            <div class="hv-header">
                <span class="hv-title">心声</span>
                <button class="hv-close" onclick="closeHeartVoicePanel()">
                    <svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke="#3a3a3c" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
                </button>
            </div>
            <div class="hv-avatar-section">
                <div class="hv-avatar" id="hvAvatar"></div>
                <div class="hv-char-name" id="hvCharName"></div>
            </div>
            <div class="hv-content">
                <div class="hv-section">
                    <div class="hv-section-label">
                        <svg viewBox="0 0 18 18" width="16" height="16"><path d="M9 16s-7-4.5-7-9A4 4 0 019 4.5 4 4 0 0116 7c0 4.5-7 9-7 9z" stroke="#3a3a3c" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
                        <span>好感度</span>
                    </div>
                    <div class="hv-affection-bar-wrap">
                        <div class="hv-affection-track">
                            <div class="hv-affection-fill" id="hvAffectionFill" style="width:50%"></div>
                        </div>
                        <span class="hv-affection-num" id="hvAffectionNum">50%</span>
                    </div>
                </div>
                <div class="hv-divider"></div>
                <div class="hv-section">
                    <div class="hv-section-label">
                        <svg viewBox="0 0 18 18" width="16" height="16"><circle cx="9" cy="9" r="7" stroke="#3a3a3c" stroke-width="1.3" fill="none"/><path d="M6.5 8.5c0-.8.7-1.5 1.5-1.5s1.5.7 1.5 1.5c0 .6-.4 1-1 1.3v1.2" stroke="#3a3a3c" stroke-width="1.3" fill="none" stroke-linecap="round"/><circle cx="9" cy="13" r=".6" fill="#3a3a3c" stroke="none"/></svg>
                        <span>内心想法</span>
                    </div>
                    <p class="hv-section-text hv-thought" id="hvThoughtText">（正在思考……）</p>
                </div>
                <div class="hv-divider"></div>
                <div class="hv-section">
                    <div class="hv-section-label">
                        <svg viewBox="0 0 18 18" width="16" height="16"><path d="M2 9s3-5 7-5 7 5 7 5-3 5-7 5-7-5-7-5z" stroke="#3a3a3c" stroke-width="1.3" fill="none"/><circle cx="9" cy="9" r="2" stroke="#3a3a3c" stroke-width="1.3" fill="none"/></svg>
                        <span>当前动作</span>
                    </div>
                    <p class="hv-section-text" id="hvActionText">（静静地看着你）</p>
                </div>
                <div class="hv-divider"></div>
                <div class="hv-section">
                    <div class="hv-section-label">
                        <svg viewBox="0 0 18 18" width="16" height="16"><path d="M9 2l2 4.5 5 .7-3.6 3.5.85 5L9 13.7 4.75 15.7l.85-5L2 7.2l5-.7z" stroke="#3a3a3c" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
                        <span>想要做的事</span>
                    </div>
                    <p class="hv-section-text" id="hvWannaDoText">（暂时没有特别想做的事）</p>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- ============ FORUM HOME ============ -->
<div class="screen" id="screen-forum-home">
	<div class="nav-bar">
		<button class="nav-btn" onclick="nav('screen-home')">
			<svg viewBox="0 0 20 20" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"><path d="M12 4l-6 6 6 6"/></svg>
		</button>
		<span class="nav-title">Home</span>
		<div class="nav-group-right">
			<button class="nav-btn" onclick="openForumSearch()" aria-label="Search">

			<span>我的</span>

<!-- ============ FORUM ME ============ -->
<div class="screen" id="screen-forum-me">
	<div class="nav-bar">
		<button class="nav-btn" onclick="nav('screen-forum-home')">
			<svg viewBox="0 0 20 20" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"><path d="M12 4l-6 6 6 6"/></svg>
		</button>
		<span class="nav-title">Me</span>
		<button class="nav-btn nav-right" onclick="openForumMeSettings()" aria-label="Settings">
			<svg viewBox="0 0 20 20" fill="none" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M4.9 15.1l1.4-1.4M13.7 6.3l1.4-1.4"/></svg>
		</button>
	</div>
	<div class="screen-body">
		<div class="forum-profile-hero">
			<div class="forum-profile-avatar" id="forumMeAvatar">
				<svg viewBox="0 0 32 32" fill="none" stroke="#c7c7cc" stroke-width="1.5"><circle cx="16" cy="12" r="5"/><path d="M6 28c0-5.5 4.5-10 10-10s10 4.5 10 10"/></svg>
			</div>
			<div class="forum-profile-name" id="forumMeName">You</div>
			<div class="forum-profile-bio" id="forumMeBio">Tap to edit your bio</div>
			<div class="forum-profile-stats">
				<div class="forum-stat">
					<div class="forum-stat-num" id="forumStatPosts">3</div>
					<div class="forum-stat-label">帖子</div>
				</div>
				<div class="forum-stat">
					<div class="forum-stat-num" id="forumStatFollowers">0</div>
					<div class="forum-stat-label">粉丝</div>
				</div>
				<div class="forum-stat">
					<div class="forum-stat-num" id="forumStatFollowing">0</div>
					<div class="forum-stat-label">关注</div>
				</div>
			</div>
		</div>
		<div class="section-header">我的帖子</div>
		<div id="forumMeList" class="forum-list"></div>
	</div>
	<div class="forum-tab-bar">
		<div class="forum-tab" data-tab="home" onclick="navForumTab('home')">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
			<span>首页</span>
		</div>
		<div class="forum-tab" data-tab="forum" onclick="navForumTab('forum')">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 11-3.5-6.5"/><path d="M3 21l3-3"/><path d="M8 11h8M8 15h5"/></svg>
			<span>论坛</span>
		</div>
		<div class="forum-tab active" data-tab="me" onclick="navForumTab('me')">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
			<span>我的</span>
		</div>
	</div>
</div>

<!-- ============ FORUM POST (DETAIL) ============ -->
<div class="screen" id="screen-forum-post">
	<div class="nav-bar">
		<button class="nav-btn" onclick="closeForumPost()">
			<svg viewBox="0 0 20 20" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"><path d="M12 4l-6 6 6 6"/></svg>
		</button>
		<span class="nav-title">Post</span>
		<div style="width:36px"></div>
	</div>
	<div class="screen-body" id="forumPostBody"></div>
	<div class="forum-comment-bar">
		<input type="text" id="forumCommentInput" class="forum-comment-input" placeholder="说点什么…" onkeydown="if(event.key==='Enter')submitForumComment()">
		<button class="forum-comment-send" onclick="submitForumComment()" aria-label="Send">
			<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l14-7-5 14-2.5-6z"/></svg>
		</button>
	</div>
</div>

<!-- ============ FORUM NEW ============ -->
<div class="screen" id="screen-forum-new">
	<div class="nav-bar">
		<button class="nav-btn" onclick="cancelForumNew()">
			<svg viewBox="0 0 20 20" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"><path d="M12 4l-6 6 6 6"/></svg>
		</button>
		<span class="nav-title">New Post</span>
		<button class="nav-btn nav-right" onclick="submitForumPost()" id="forumPostSubmitBtn" disabled>
			<span style="font-size:15px;font-weight:600;color:#8e8e93">发布</span>
		</button>
	</div>
	<div class="screen-body">
		<div class="forum-new-section">
			<div class="forum-new-label">分类</div>
			<div class="forum-cat-bar" id="forumNewCatBar">
				<div class="forum-cat active" data-cat="Character Share" onclick="setNewPostCat('Character Share')">角色分享</div>
				<div class="forum-cat" data-cat="Tips" onclick="setNewPostCat('Tips')">技巧</div>
				<div class="forum-cat" data-cat="Help" onclick="setNewPostCat('Help')">求助</div>
				<div class="forum-cat" data-cat="Off-Topic" onclick="setNewPostCat('Off-Topic')">闲聊</div>
			</div>
		</div>
		<div class="forum-new-section">
			<div class="forum-new-label">标题</div>
			<input type="text" class="forum-new-input" id="forumNewTitle" placeholder="给帖子起个标题…" oninput="onForumNewInput()">
		</div>
		<div class="forum-new-section">
			<div class="forum-new-label">内容</div>
			<textarea class="forum-new-textarea" id="forumNewContent" placeholder="分享你的想法…" rows="8" oninput="onForumNewInput()"></textarea>
		</div>
		<div style="height:32px"></div>
	</div>
</div>

<!-- ARCHIVE -->
<div class="screen" id="screen-archive">
	<div class="nav-bar">
		<button class="nav-btn" onclick="nav('screen-home')">
			<svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
		</button>
		<span class="nav-title">Archive</span>
	</div>
	<div class="large-title">Archive</div>
	<div class="screen-body">
		<div style="margin:0 16px 20px;background:linear-gradient(135deg,#1d1d1f,#3a3a3c);border-radius:20px;padding:28px 24px;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.2)">
			<div style="position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.03)"></div>
			<div style="font-size:22px;font-weight:700;margin-bottom:4px;position:relative">Data Management</div>
			<div style="font-size:13px;color:rgba(255,255,255,.45);position:relative">Backup and Restore Your Data</div>
		</div>
		<div style="padding:20px 20px 8px;font-size:13px;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px;font-weight:600">导出</div>
		<div style="margin:0 16px 16px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ececec">
			<div onclick="exportAllData()" style="display:flex;align-items:center;padding:14px 16px;gap:14px;cursor:pointer;border-bottom:1px solid #f2f2f7;transition:background .15s" onmousedown="this.style.background='#f2f2f7'" onmouseup="this.style.background=''" onmouseleave="this.style.background=''">
				<div style="width:36px;height:36px;border-radius:10px;background:#f2f2f7;display:flex;align-items:center;justify-content:center;flex-shrink:0">
					<svg viewBox="0 0 20 20" style="width:18px;height:18px;stroke:#3a3a3c;fill:none;stroke-width:1.5"><path d="M10 3v10M6 9l4 4 4-4"/><path d="M3 13v3a2 2 0 002 2h10a2 2 0 002-2v-3"/></svg>
				</div>
				<div style="flex:1">
					<div style="font-size:15px;font-weight:500;color:#1d1d1f">导出全部数据</div>
					<div style="font-size:12px;color:#8e8e93;margin-top:1px">角色、聊天、世界书、设置</div>
				</div>
				<svg viewBox="0 0 20 20" style="width:14px;height:14px;stroke:#c7c7cc;fill:none;stroke-width:2;flex-shrink:0"><path d="M8 4l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
			</div>
			<div onclick="exportCharsOnly()" style="display:flex;align-items:center;padding:14px 16px;gap:14px;cursor:pointer;transition:background .15s" onmousedown="this.style.background='#f2f2f7'" onmouseup="this.style.background=''" onmouseleave="this.style.background=''">
				<div style="width:36px;height:36px;border-radius:10px;background:#f2f2f7;display:flex;align-items:center;justify-content:center;flex-shrink:0">
					<svg viewBox="0 0 20 20" style="width:18px;height:18px;stroke:#3a3a3c;fill:none;stroke-width:1.5"><path d="M4 4h12a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z"/><path d="M8 10h4M10 8v4"/></svg>
				</div>
				<div style="flex:1">
					<div style="font-size:15px;font-weight:500;color:#1d1d1f">仅导出角色</div>
					<div style="font-size:12px;color:#8e8e93;margin-top:1px">角色卡及聊天记录</div>
				</div>
				<svg viewBox="0 0 20 20" style="width:14px;height:14px;stroke:#c7c7cc;fill:none;stroke-width:2;flex-shrink:0"><path d="M8 4l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
			</div>
		</div>
		<div style="padding:20px 20px 8px;font-size:13px;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px;font-weight:600">导入</div>
		<div style="margin:0 16px 16px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ececec">
			<div onclick="importData()" style="display:flex;align-items:center;padding:14px 16px;gap:14px;cursor:pointer;transition:background .15s" onmousedown="this.style.background='#f2f2f7'" onmouseup="this.style.background=''" onmouseleave="this.style.background=''">
				<div style="width:36px;height:36px;border-radius:10px;background:#f2f2f7;display:flex;align-items:center;justify-content:center;flex-shrink:0">
					<svg viewBox="0 0 20 20" style="width:18px;height:18px;stroke:#3a3a3c;fill:none;stroke-width:1.5"><path d="M10 13V3M6 7l4-4 4 4"/><path d="M3 13v3a2 2 0 002 2h10a2 2 0 002-2v-3"/></svg>
				</div>
				<div style="flex:1">
					<div style="font-size:15px;font-weight:500;color:#1d1d1f">导入数据</div>
					<div style="font-size:12px;color:#8e8e93;margin-top:1px">从备份文件恢复</div>
				</div>
				<svg viewBox="0 0 20 20" style="width:14px;height:14px;stroke:#c7c7cc;fill:none;stroke-width:2;flex-shrink:0"><path d="M8 4l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
			</div>
		</div>
		<div style="padding:20px 20px 8px;font-size:13px;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px;font-weight:600">危险区域</div>
		<div style="margin:0 16px 16px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ececec">
			<div onclick="clearAllData()" style="display:flex;align-items:center;padding:14px 16px;gap:14px;cursor:pointer;transition:background .15s" onmousedown="this.style.background='#fff5f5'" onmouseup="this.style.background=''" onmouseleave="this.style.background=''">
				<div style="width:36px;height:36px;border-radius:10px;background:#fff5f5;display:flex;align-items:center;justify-content:center;flex-shrink:0">
					<svg viewBox="0 0 20 20" style="width:18px;height:18px;stroke:#ff3b30;fill:none;stroke-width:1.5"><path d="M3 6h14M7 6V4a1 1 0 011-1h4a1 1 0 011 1v2M5 6v11a2 2 0 002 2h6a2 2 0 002-2V6"/></svg>
				</div>
				<div style="flex:1">
					<div style="font-size:15px;font-weight:500;color:#ff3b30">清除全部数据</div>
					<div style="font-size:12px;color:#8e8e93;margin-top:1px">此操作无法撤销</div>
				</div>
			</div>
		</div>
		<div style="margin:0 32px 12px;font-size:12px;color:#8e8e93;line-height:1.4;text-align:center">数据储存在浏览器本地。请定期导出以防数据丢失。</div>
		<div style="height:40px"></div>
	</div>
</div>

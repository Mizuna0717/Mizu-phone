<!-- THEME -->
<div class="screen" id="screen-theme">
  <div class="nav-bar">
    <button class="nav-btn" onclick="nav('screen-home')">
      <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="nav-title">主题定制</span>
  </div>
  <div class="large-title">主题定制</div>

  <!-- Module Tabs -->
  <div class="theme-tabs" id="themeModuleTabs"></div>

  <!-- Module: Font Size -->
  <div class="theme-module active" id="themeModule-fontSize">
    <div class="screen-body">
      <div class="theme-font-options">
        <div class="theme-font-option" data-size="small" onclick="selectFontSize('small')">
          <span class="tfo-sample" style="font-size:12px">A</span>
          <span class="tfo-label">小</span>
          <span class="tfo-label" style="font-size:10px;color:#c7c7cc">12px</span>
        </div>
        <div class="theme-font-option active" data-size="medium" onclick="selectFontSize('medium')">
          <span class="tfo-sample" style="font-size:14px">A</span>
          <span class="tfo-label">中</span>
          <span class="tfo-label" style="font-size:10px;color:#c7c7cc">14px</span>
        </div>
        <div class="theme-font-option" data-size="large" onclick="selectFontSize('large')">
          <span class="tfo-sample" style="font-size:16px">A</span>
          <span class="tfo-label">大</span>
          <span class="tfo-label" style="font-size:10px;color:#c7c7cc">16px</span>
        </div>
        <div class="theme-font-option" data-size="xlarge" onclick="selectFontSize('xlarge')">
          <span class="tfo-sample" style="font-size:18px">A</span>
          <span class="tfo-label">特大</span>
          <span class="tfo-label" style="font-size:10px;color:#c7c7cc">18px</span>
        </div>
      </div>

      <div class="theme-font-preview">
        <div class="theme-font-preview-label">预览</div>
        <div class="theme-font-preview-bubbles" id="themeFontPreviewText">
          <div class="tfpb-row received">
            <div class="tfpb-bubble">你好，最近怎么样？</div>
          </div>
          <div class="tfpb-row sent">
            <div class="tfpb-bubble">还不错，你呢</div>
          </div>
          <div class="tfpb-row received">
            <div class="tfpb-bubble">今天天气真好，要不要出去走走</div>
          </div>
        </div>
      </div>

      <div style="height:30px"></div>
    </div>
  </div>

  <!-- Module: Chat Bubble -->
  <div class="theme-module" id="themeModule-chatBubble">
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:0 16px 8px;flex-shrink:0">
        <div class="theme-preview-label">预览</div>
        <div class="theme-preview-frame" id="themePreview-chatBubble">
          <div class="tpf-chat">
            <div class="tpf-row received"><div class="tpf-bubble">你好呀</div></div>
            <div class="tpf-row sent"><div class="tpf-bubble">嗨！</div></div>
            <div class="tpf-row received"><div class="tpf-bubble">今天过得怎么样</div></div>
            <div class="tpf-row sent"><div class="tpf-bubble">还不错，谢谢关心</div></div>
          </div>
        </div>
      </div>
      <div class="theme-editor-wrap">
        <div class="theme-editor-header">
          <span class="theme-editor-label">自定义 CSS</span>
          <div class="theme-editor-actions">
            <button class="theme-editor-btn" onclick="copyThemeSourceCSS('chatBubble')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M3 11V3h8"/></svg>
              复制源码
            </button>
            <button class="theme-editor-btn" onclick="resetThemeCSS('chatBubble')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 0 1.5-3.5L3 6"/><path d="M3 3v3h3"/></svg>
              重置
            </button>
          </div>
        </div>
        <textarea class="theme-editor-textarea" id="themeEditor-chatBubble" placeholder="/* 在此输入 CSS 代码 */" oninput="themeEditorInput('chatBubble')"></textarea>
        <div class="theme-editor-error"></div>
      </div>
      <div class="theme-apply-row">
        <button class="theme-editor-btn apply-btn" style="width:100%;justify-content:center;padding:12px" onclick="applyThemeCSS('chatBubble')">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>
          应用
        </button>
      </div>
    </div>
  </div>

  <!-- Module: Chat Interface -->
  <div class="theme-module" id="themeModule-chatInterface">
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:0 16px 8px;flex-shrink:0">
        <div class="theme-preview-label">预览</div>
        <div class="theme-preview-frame" id="themePreview-chatInterface">
          <div class="tpf-interface">
            <div class="tpf-header">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#aeaeb2" stroke-width="2" stroke-linecap="round"><path d="M10 3L5 8l5 5"/></svg>
              <div class="tpf-avatar">
                <svg viewBox="0 0 16 16" fill="none" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="6" r="3"/><path d="M2 14c0-3.3 2.7-5 6-5s6 1.7 6 5"/></svg>
              </div>
              <div class="tpf-name">角色名称</div>
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="4" cy="8" r="1"/></svg>
            </div>
            <div class="tpf-msgs">
              <div class="tpf-row received"><div class="tpf-bubble" style="font-size:12px">你好呀</div></div>
              <div class="tpf-row sent"><div class="tpf-bubble" style="font-size:12px">嗨！</div></div>
            </div>
            <div class="tpf-input-row">
              <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg>
              <div class="tpf-input-pill"></div>
              <div class="tpf-send-dot">
                <svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h8M6 2l4 4-4 4"/></svg>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="theme-editor-wrap">
        <div class="theme-editor-header">
          <span class="theme-editor-label">自定义 CSS</span>
          <div class="theme-editor-actions">
            <button class="theme-editor-btn" onclick="copyThemeSourceCSS('chatInterface')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M3 11V3h8"/></svg>
              复制源码
            </button>
            <button class="theme-editor-btn" onclick="resetThemeCSS('chatInterface')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 0 1.5-3.5L3 6"/><path d="M3 3v3h3"/></svg>
              重置
            </button>
          </div>
        </div>
        <textarea class="theme-editor-textarea" id="themeEditor-chatInterface" placeholder="/* 在此输入 CSS 代码 */" oninput="themeEditorInput('chatInterface')"></textarea>
        <div class="theme-editor-error"></div>
      </div>
      <div class="theme-apply-row">
        <button class="theme-editor-btn apply-btn" style="width:100%;justify-content:center;padding:12px" onclick="applyThemeCSS('chatInterface')">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>
          应用
        </button>
      </div>
    </div>
  </div>

  <!-- Module: Meeting Style -->
  <div class="theme-module" id="themeModule-meetingStyle">
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:0 16px 8px;flex-shrink:0">
        <div class="theme-preview-label">预览</div>
        <div class="theme-preview-frame" id="themePreview-meetingStyle">
          <div class="tpf-meeting">
            <div class="tpf-meeting-header">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#aeaeb2" stroke-width="2" stroke-linecap="round"><path d="M10 3L5 8l5 5"/></svg>
              <div class="tpf-meeting-title">存档名称</div>
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="4" cy="8" r="1"/></svg>
            </div>
            <div style="padding:8px">
              <div style="background:#fff;border-radius:10px;border:1px solid #ececec;padding:8px 10px;margin-bottom:6px">
                <div style="font-size:11px;color:#8e8e93;margin-bottom:3px">系统</div>
                <div style="font-size:12px;color:#1d1d1f;line-height:1.4">故事从这里开始...</div>
              </div>
              <div style="background:#f2f2f7;border-radius:10px;border:1px solid #ececec;padding:8px 10px">
                <div style="font-size:11px;color:#8e8e93;margin-bottom:3px">你</div>
                <div style="font-size:12px;color:#1d1d1f;line-height:1.4">我走进了那扇门...</div>
              </div>
            </div>
            <div class="tpf-meeting-input-row">
              <div class="tpf-input-pill"></div>
              <div class="tpf-send-dot">
                <svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h8M6 2l4 4-4 4"/></svg>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="theme-editor-wrap">
        <div class="theme-editor-header">
          <span class="theme-editor-label">自定义 CSS</span>
          <div class="theme-editor-actions">
            <button class="theme-editor-btn" onclick="copyThemeSourceCSS('meetingStyle')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M3 11V3h8"/></svg>
              复制源码
            </button>
            <button class="theme-editor-btn" onclick="resetThemeCSS('meetingStyle')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 0 1.5-3.5L3 6"/><path d="M3 3v3h3"/></svg>
              重置
            </button>
          </div>
        </div>
        <textarea class="theme-editor-textarea" id="themeEditor-meetingStyle" placeholder="/* 在此输入 CSS 代码 */" oninput="themeEditorInput('meetingStyle')"></textarea>
        <div class="theme-editor-error"></div>
      </div>
      <div class="theme-apply-row">
        <button class="theme-editor-btn apply-btn" style="width:100%;justify-content:center;padding:12px" onclick="applyThemeCSS('meetingStyle')">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>
          应用
        </button>
      </div>
    </div>
  </div>

  <!-- Module: Heart Panel -->
  <div class="theme-module" id="themeModule-heartPanel">
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:0 16px 8px;flex-shrink:0">
        <div class="theme-preview-label">预览</div>
        <div class="theme-preview-frame" id="themePreview-heartPanel">
          <div class="tpf-heart">
            <div class="tpf-heart-header">心声</div>
            <div class="tpf-heart-item">
              <div class="tpf-heart-dot"></div>
              <div class="tpf-heart-text">今天心情不错</div>
              <div class="tpf-heart-val">+12</div>
            </div>
            <div class="tpf-heart-item">
              <div class="tpf-heart-dot" style="background:#aeaeb2"></div>
              <div class="tpf-heart-text">有点想你了</div>
              <div class="tpf-heart-val">+8</div>
            </div>
          </div>
        </div>
      </div>
      <div class="theme-editor-wrap">
        <div class="theme-editor-header">
          <span class="theme-editor-label">自定义 CSS</span>
          <div class="theme-editor-actions">
            <button class="theme-editor-btn" onclick="copyThemeSourceCSS('heartPanel')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M3 11V3h8"/></svg>
              复制源码
            </button>
            <button class="theme-editor-btn" onclick="resetThemeCSS('heartPanel')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 0 1.5-3.5L3 6"/><path d="M3 3v3h3"/></svg>
              重置
            </button>
          </div>
        </div>
        <textarea class="theme-editor-textarea" id="themeEditor-heartPanel" placeholder="/* 在此输入 CSS 代码 */" oninput="themeEditorInput('heartPanel')"></textarea>
        <div class="theme-editor-error"></div>
      </div>
      <div class="theme-apply-row">
        <button class="theme-editor-btn apply-btn" style="width:100%;justify-content:center;padding:12px" onclick="applyThemeCSS('heartPanel')">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>
          应用
        </button>
      </div>
    </div>
  </div>

  <!-- Module: Meeting Archive -->
  <div class="theme-module" id="themeModule-meetingArchive">
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:0 16px 8px;flex-shrink:0">
        <div class="theme-preview-label">预览</div>
        <div class="theme-preview-frame" id="themePreview-meetingArchive">
          <div class="tpf-archive">
            <div class="tpf-archive-card">
              <div class="tpf-archive-icon">
                <svg viewBox="0 0 16 16" fill="none" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h10v9a1 1 0 01-1 1H4a1 1 0 01-1-1V4z"/><path d="M1 4h14"/><path d="M6 2h4"/></svg>
              </div>
              <div class="tpf-archive-info">
                <div class="tpf-archive-title">冬日咖啡馆</div>
                <div class="tpf-archive-sub">12 轮 · 3 条记忆</div>
              </div>
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-linecap="round"><path d="M6 4l4 4-4 4"/></svg>
            </div>
            <div class="tpf-archive-card">
              <div class="tpf-archive-icon">
                <svg viewBox="0 0 16 16" fill="none" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h10v9a1 1 0 01-1 1H4a1 1 0 01-1-1V4z"/><path d="M1 4h14"/><path d="M6 2h4"/></svg>
              </div>
              <div class="tpf-archive-info">
                <div class="tpf-archive-title">雨夜书店</div>
                <div class="tpf-archive-sub">8 轮 · 1 条记忆</div>
              </div>
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-linecap="round"><path d="M6 4l4 4-4 4"/></svg>
            </div>
          </div>
        </div>
      </div>
      <div class="theme-editor-wrap">
        <div class="theme-editor-header">
          <span class="theme-editor-label">自定义 CSS</span>
          <div class="theme-editor-actions">
            <button class="theme-editor-btn" onclick="copyThemeSourceCSS('meetingArchive')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M3 11V3h8"/></svg>
              复制源码
            </button>
            <button class="theme-editor-btn" onclick="resetThemeCSS('meetingArchive')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 0 1.5-3.5L3 6"/><path d="M3 3v3h3"/></svg>
              重置
            </button>
          </div>
        </div>
        <textarea class="theme-editor-textarea" id="themeEditor-meetingArchive" placeholder="/* 在此输入 CSS 代码 */" oninput="themeEditorInput('meetingArchive')"></textarea>
        <div class="theme-editor-error"></div>
      </div>
      <div class="theme-apply-row">
        <button class="theme-editor-btn apply-btn" style="width:100%;justify-content:center;padding:12px" onclick="applyThemeCSS('meetingArchive')">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>
          应用
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ====== MEETING MANAGE SCREEN ====== -->
<div class="screen" id="screen-meeting-manage">
  <div class="nav-bar">
    <button class="nav-btn" onclick="exitMeetingManage()">
      <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="nav-title" data-i18n="meetingManageTitle">Manage</span>
    <div style="width:32px"></div>
  </div>
  <div class="large-title" data-i18n="meetingManageTitle">Manage</div>

  <div class="screen-body" style="padding-bottom:40px">

    <!-- Session Info (read-only, filled by JS: mtgRenderManagePage) -->
    <div class="mtg-panel-section-hdr" data-i18n="meetingSessionInfo">SESSION INFO</div>
    <div class="mtg-manage-card" id="mtgManageInfo">
      <!-- JS renders mtg-manage-row elements here -->
    </div>

    <!-- Editable Settings -->
    <div class="mtg-panel-section-hdr" data-i18n="meetingEditableSettings">SETTINGS</div>
    <div class="mtg-panel-card">

      <!-- Character Perspective -->
      <div class="mtg-panel-col-row">
        <div class="mtg-panel-sublabel" data-i18n="meetingCharPerspective">Character Perspective</div>
        <div class="mtg-seg" id="mtgManageCharPersonSeg">
          <div class="mtg-seg-opt" data-value="first" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingFirstPerson">First</span>
          </div>
          <div class="mtg-seg-opt" data-value="second" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingSecondPerson">Second</span>
          </div>
          <div class="mtg-seg-opt" data-value="third" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingThirdPerson">Third</span>
          </div>
        </div>
      </div>

      <div class="mtg-panel-divider"></div>

      <!-- User Perspective -->
      <div class="mtg-panel-col-row">
        <div class="mtg-panel-sublabel" data-i18n="meetingUserPerspective">User Perspective</div>
        <div class="mtg-seg" id="mtgManageUserPersonSeg">
          <div class="mtg-seg-opt" data-value="first" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingFirstPerson">First</span>
          </div>
          <div class="mtg-seg-opt" data-value="second" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingSecondPerson">Second</span>
          </div>
          <div class="mtg-seg-opt" data-value="third" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingThirdPerson">Third</span>
          </div>
        </div>
      </div>

      <div class="mtg-panel-divider"></div>

      <!-- Word Count Min -->
      <div class="mtg-panel-row">
        <span class="mtg-panel-label" data-i18n="meetingMin">Min Words</span>
        <input type="number" class="mtg-panel-num" id="mtgManageWcMin">
      </div>

      <div class="mtg-panel-divider"></div>

      <!-- Word Count Max -->
      <div class="mtg-panel-row">
        <span class="mtg-panel-label" data-i18n="meetingMax">Max Words</span>
        <input type="number" class="mtg-panel-num" id="mtgManageWcMax">
      </div>

      <div class="mtg-panel-divider"></div>

      <!-- Summary Interval -->
      <div class="mtg-panel-row">
        <span class="mtg-panel-label" data-i18n="meetingSummaryInterval">Summary Interval</span>
        <input type="number" class="mtg-panel-num" id="mtgManageSummaryInterval" min="2" max="50">
      </div>
    </div>

    <!-- Save Button -->
    <div style="padding:20px 16px 0">
      <button class="mtg-panel-primary-btn" onclick="mtgSaveManageChanges()">
        <svg viewBox="0 0 16 16" style="width:14px;height:14px;margin-right:6px">
          <path d="M3 8l3 3 7-7" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="meetingSaveChanges">Save Changes</span>
      </button>
    </div>

    <!-- Short-Term Memory -->
    <div class="mtg-panel-section-hdr" data-i18n="meetingShortTermMemory">SHORT-TERM MEMORY</div>
    <!-- JS: mtgRenderManageMemory() renders mtg-manage-mem-item elements here -->
    <div id="mtgManageMemoryList"></div>

  </div>
</div>

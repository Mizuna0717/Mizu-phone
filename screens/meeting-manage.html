<!-- ====== MEETING MANAGE SCREEN ====== -->
<div class="screen" id="screen-meeting-manage">
  <div class="nav-bar">
    <button class="nav-btn" onclick="exitMeetingManage()">
      <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="nav-title" data-i18n="meetingManageTitle">Manage</span>
    <div style="width:32px"></div>
  </div>
  <div class="large-title" data-i18n="meetingManageTitle">Manage</div>

  <div class="screen-body" style="padding:0 20px 40px">

    <!-- Session Info (read-only) -->
    <div class="mtg-field">
      <div class="mtg-field-label" data-i18n="meetingSessionInfo">SESSION INFO</div>
      <div class="mtg-manage-card" id="mtgManageInfo"></div>
    </div>

    <!-- Editable Settings -->
    <div class="mtg-field">
      <div class="mtg-field-label" data-i18n="meetingEditableSettings">SETTINGS</div>

      <div style="margin-bottom:14px">
        <div class="mtg-field-hint" data-i18n="meetingCharPerspective">Character Perspective</div>
        <div class="mtg-seg" id="mtgManageCharPersonSeg">
          <div class="mtg-seg-opt" data-value="first" onclick="mtgSetToggleSeg(this)"><span data-i18n="meetingFirstPerson">First</span></div>
          <div class="mtg-seg-opt" data-value="second" onclick="mtgSetToggleSeg(this)"><span data-i18n="meetingSecondPerson">Second</span></div>
          <div class="mtg-seg-opt" data-value="third" onclick="mtgSetToggleSeg(this)"><span data-i18n="meetingThirdPerson">Third</span></div>
        </div>
      </div>

      <div style="margin-bottom:14px">
        <div class="mtg-field-hint" data-i18n="meetingUserPerspective">User Perspective</div>
        <div class="mtg-seg" id="mtgManageUserPersonSeg">
          <div class="mtg-seg-opt" data-value="first" onclick="mtgSetToggleSeg(this)"><span data-i18n="meetingFirstPerson">First</span></div>
          <div class="mtg-seg-opt" data-value="second" onclick="mtgSetToggleSeg(this)"><span data-i18n="meetingSecondPerson">Second</span></div>
          <div class="mtg-seg-opt" data-value="third" onclick="mtgSetToggleSeg(this)"><span data-i18n="meetingThirdPerson">Third</span></div>
        </div>
      </div>

      <div style="margin-bottom:14px">
        <div class="mtg-field-hint" data-i18n="meetingWordCount">Word Count</div>
        <div style="display:flex;gap:12px;align-items:center">
          <div style="flex:1"><input type="number" class="mtg-field-input" id="mtgManageWcMin"></div>
          <span style="color:#c7c7cc;font-size:12px">-</span>
          <div style="flex:1"><input type="number" class="mtg-field-input" id="mtgManageWcMax"></div>
        </div>
      </div>

      <div style="margin-bottom:14px">
        <div class="mtg-field-hint" data-i18n="meetingSummaryInterval">Summary Interval (turns)</div>
        <input type="number" class="mtg-field-input" id="mtgManageSummaryInterval" min="2" max="50">
      </div>

      <button class="mtg-save-btn" onclick="mtgSaveManageChanges()">
        <svg viewBox="0 0 16 16" style="width:14px;height:14px;margin-right:6px"><path d="M3 8l3 3 7-7" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="meetingSaveChanges">Save Changes</span>
      </button>
    </div>

    <!-- Short-Term Memory -->
    <div class="mtg-field">
      <div class="mtg-field-label" data-i18n="meetingShortTermMemory">SHORT-TERM MEMORY</div>
      <div id="mtgManageMemoryList"></div>
    </div>

  </div>
</div>

<!-- ====== MEETING SCREEN ====== -->
<div class="screen" id="screen-meeting">
  <div class="nav-bar" style="position:relative">
    <button class="nav-btn" onclick="nav('screen-home')">
      <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="nav-title" data-i18n="meetingTitle">Meeting</span>
    <button class="nav-btn" id="meetingPlusBtn" onclick="openMeetingSettings()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%)">
      <svg viewBox="0 0 20 20" style="width:22px;height:22px"><path d="M10 4v12M4 10h12" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="large-title" data-i18n="meetingTitle">Meeting</div>

  <div class="screen-body">
    <!-- ── Tab Switcher ── -->
    <div class="mtg-tabs" id="meetingTabs">
      <div class="mtg-tab active" data-tab="continue" onclick="switchMeetingTab('continue')">
        <span data-i18n="meetingContinue">Continue</span>
      </div>
      <div class="mtg-tab" data-tab="if" onclick="switchMeetingTab('if')">
        <span data-i18n="meetingIF">IF</span>
      </div>
    </div>

    <!-- ── Continue Section ── -->
    <div class="mtg-section" id="meetingSectionContinue">
      <div style="padding:20px 20px 8px;font-size:13px;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:flex;align-items:center;gap:8px">
        <svg viewBox="0 0 16 16" style="width:14px;height:14px;stroke:#8e8e93;fill:none;stroke-width:1.5">
          <path d="M3 13V3h7l3 3v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
          <path d="M10 3v3h3"/><path d="M6 9h4M6 11h2"/>
        </svg>
        <span data-i18n="meetingContinue">CONTINUE</span>
      </div>
      <div id="meetingContinueCards" style="margin:0 16px 16px"></div>
    </div>

    <!-- ── IF Section ── -->
    <div class="mtg-section" id="meetingSectionIF" style="display:none">
      <div style="padding:20px 20px 8px;font-size:13px;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:flex;align-items:center;gap:8px">
        <svg viewBox="0 0 16 16" style="width:14px;height:14px;stroke:#8e8e93;fill:none;stroke-width:1.5">
          <circle cx="8" cy="2.5" r="1.5"/><path d="M8 4v3"/><path d="M4.5 9.5L8 7l3.5 2.5"/><path d="M4.5 9.5v3"/><path d="M11.5 9.5v3"/>
        </svg>
        <span data-i18n="meetingIF">IF</span>
      </div>
      <div id="meetingIFCards" style="margin:0 16px 16px"></div>
    </div>

    <div style="height:40px"></div>
  </div>
</div>

<!-- ====== MEETING WRITING SCREEN ====== -->
<div class="screen" id="screen-meeting-write">
  <div class="nav-bar" style="position:relative">
    <button class="nav-btn" onclick="exitMeetingWrite()">
      <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="nav-title" id="meetingWriteTitle">Session</span>
    <button class="nav-btn" id="meetingWriteMenuBtn" onclick="showToast(T('meetingUiOnly'))" style="position:absolute;right:8px;top:50%;transform:translateY(-50%)">
      <svg viewBox="0 0 20 20" style="width:20px;height:20px">
        <circle cx="10" cy="4" r="1.5" fill="#1d1d1f"/><circle cx="10" cy="10" r="1.5" fill="#1d1d1f"/><circle cx="10" cy="16" r="1.5" fill="#1d1d1f"/>
      </svg>
    </button>
  </div>

  <div class="screen-body mtg-write-scroll" id="meetingWriteBody">
    <!-- rendered by JS -->
  </div>

  <div class="mtg-write-bar">
    <textarea class="mtg-write-input" id="meetingWriteInput" rows="1" data-i18n="meetingWritePh" placeholder="Your turn to write..."></textarea>
    <button class="mtg-write-send" onclick="meetingWriteSend()">
      <svg viewBox="0 0 20 20" style="width:18px;height:18px"><path d="M3 10h14M12 5l5 5-5 5" stroke="#8e8e93" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<!-- ====== MEETING SETTINGS MODAL ====== -->
<div class="modal" id="meetingSettingsModal">
  <div class="modal-mask" onclick="closeModal('meetingSettingsModal')"></div>
  <div class="modal-card" style="max-height:88vh;display:flex;flex-direction:column">

    <!-- Header -->
    <div style="display:flex;align-items:center;padding:16px 20px 12px;flex-shrink:0">
      <span style="font-size:17px;font-weight:700;flex:1" data-i18n="meetingNewSession">New Session</span>
      <button onclick="closeModal('meetingSettingsModal')" style="background:none;border:none;padding:4px;cursor:pointer;line-height:0">
        <svg viewBox="0 0 20 20" style="width:20px;height:20px"><path d="M5 5l10 10M15 5L5 15" stroke="#8e8e93" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- Scrollable Content -->
    <div style="flex:1;overflow-y:auto;padding:0 20px 20px;-webkit-overflow-scrolling:touch">

      <!-- 1. Session Name -->
      <div class="mtg-field">
        <div class="mtg-field-label" data-i18n="meetingSessionName">Session Name</div>
        <input type="text" class="mtg-field-input" id="meetingSessionName" data-i18n="meetingSessionNamePh" placeholder="Enter session name">
      </div>

      <!-- 2. Mode -->
      <div class="mtg-field">
        <div class="mtg-field-label" data-i18n="meetingMode">MODE</div>
        <div class="mtg-seg mtg-mode-seg">
          <div class="mtg-seg-opt active" data-value="continue" onclick="mtgToggleSeg(this)">
            <span data-i18n="meetingContinue">Continue</span>
          </div>
          <div class="mtg-seg-opt" data-value="if" onclick="mtgToggleSeg(this)">
            <span data-i18n="meetingIF">IF</span>
          </div>
        </div>
      </div>

      <!-- 3. Person -->
      <div class="mtg-field">
        <div class="mtg-field-label" data-i18n="meetingPerson">PERSON</div>
        <div class="mtg-seg mtg-person-seg">
          <div class="mtg-seg-opt active" data-value="first" onclick="mtgToggleSeg(this)">
            <span data-i18n="meetingFirstPerson">First Person</span>
          </div>
          <div class="mtg-seg-opt" data-value="third" onclick="mtgToggleSeg(this)">
            <span data-i18n="meetingThirdPerson">Third Person</span>
          </div>
        </div>
      </div>

      <!-- 4. Word Count -->
      <div class="mtg-field">
        <div class="mtg-field-label" data-i18n="meetingWordCount">WORD COUNT</div>
        <div style="display:flex;gap:12px;align-items:center">
          <div style="flex:1">
            <div style="font-size:11px;color:#b0b0b5;margin-bottom:4px" data-i18n="meetingMin">Min</div>
            <input type="number" class="mtg-field-input" id="meetingWcMin" value="100" min="10" max="2000">
          </div>
          <svg viewBox="0 0 20 20" style="width:14px;height:14px;margin-top:14px;flex-shrink:0"><path d="M4 10h12" stroke="#c7c7cc" fill="none" stroke-width="1.5" stroke-linecap="round"/></svg>
          <div style="flex:1">
            <div style="font-size:11px;color:#b0b0b5;margin-bottom:4px" data-i18n="meetingMax">Max</div>
            <input type="number" class="mtg-field-input" id="meetingWcMax" value="300" min="10" max="5000">
          </div>
        </div>
      </div>

      <!-- 5. Characters -->
      <div class="mtg-field">
        <div class="mtg-field-label" data-i18n="meetingCharacters">CHARACTERS</div>
        <div class="mtg-char-list" id="meetingCharSelect">
          <!-- rendered by JS -->
        </div>
      </div>

      <!-- 6. Turn Summary -->
      <div class="mtg-field">
        <div class="mtg-field-label" data-i18n="meetingTurnSummary">TURN SUMMARY</div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0">
          <span style="font-size:14px;color:#1d1d1f" data-i18n="meetingTurnSummaryEnable">Enable turn summary</span>
          <div class="mtg-toggle mtg-toggle-summary" onclick="this.classList.toggle('active')"></div>
        </div>
        <div style="font-size:11px;color:#b0b0b5;margin-top:4px" data-i18n="meetingTurnSummaryHint">Automatically summarize every N turns</div>
      </div>

      <!-- 7. Worldview / Identity -->
      <div class="mtg-field">
        <div class="mtg-field-label" data-i18n="meetingWorldview">WORLDVIEW / IDENTITY</div>
        <textarea class="mtg-textarea" id="meetingWorldview" rows="4" data-i18n="meetingWorldviewPh" placeholder="Enter worldview or identity setting..."></textarea>
      </div>

      <!-- Start Button -->
      <button class="mtg-start-btn" onclick="startMeetingSession()">
        <svg viewBox="0 0 20 20" style="width:16px;height:16px;margin-right:6px"><path d="M6 4l10 6-10 6z" stroke="#fff" fill="none" stroke-width="2" stroke-linejoin="round"/></svg>
        <span data-i18n="meetingStart">Start</span>
      </button>

    </div>
  </div>
</div>

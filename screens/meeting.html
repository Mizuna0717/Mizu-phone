<!-- ====== MEETING SCREEN (Main List) ====== -->
<div class="screen" id="screen-meeting">
  <div class="nav-bar">
    <button class="nav-btn" onclick="nav('screen-home')">
      <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="nav-title" data-i18n="meetingTitle">Meeting</span>
    <div style="width:32px"></div>
  </div>
  <div class="large-title" data-i18n="meetingTitle">Meeting</div>

  <div class="screen-body">
    <!-- New Archive Button -->
    <div style="padding:4px 16px 8px">
      <button class="mtg-new-archive-btn" onclick="openMeetingSettings()">
        <svg viewBox="0 0 18 18" style="width:16px;height:16px;stroke:#8e8e93;fill:none;stroke-width:1.8;stroke-linecap:round">
          <path d="M9 3v12M3 9h12"/>
        </svg>
        <span data-i18n="meetingNewArchive">New Archive</span>
      </button>
    </div>

    <!-- Continue Section -->
    <div class="mtg-section" id="meetingSectionContinue">
      <div class="mtg-section-header">
        <svg viewBox="0 0 16 16" style="width:14px;height:14px;stroke:#8e8e93;fill:none;stroke-width:1.5">
          <path d="M3 13V3h7l3 3v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
          <path d="M10 3v3h3"/><path d="M6 9h4M6 11h2"/>
        </svg>
        <span data-i18n="meetingContinue">CONTINUE</span>
      </div>
      <div id="meetingContinueCards"></div>
    </div>

    <!-- IF Section -->
    <div class="mtg-section" id="meetingSectionIF">
      <div class="mtg-section-header">
        <svg viewBox="0 0 16 16" style="width:14px;height:14px;stroke:#8e8e93;fill:none;stroke-width:1.5">
          <circle cx="8" cy="2.5" r="1.5"/><path d="M8 4v3"/>
          <path d="M4.5 9.5L8 7l3.5 2.5"/>
          <path d="M4.5 9.5v3"/><path d="M11.5 9.5v3"/>
        </svg>
        <span data-i18n="meetingIF">IF</span>
      </div>
      <div id="meetingIFCards"></div>
    </div>

    <div style="height:40px"></div>
  </div>
</div>


<!-- ====== MEETING WRITING SCREEN ====== -->
<div class="screen" id="screen-meeting-write">
  <div class="nav-bar" style="position:relative">
    <button class="nav-btn" onclick="exitMeetingWrite()">
      <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="nav-title" id="meetingWriteTitle">Session</span>
    <!-- End Session -->
    <button class="nav-btn" onclick="mtgEndSession()" style="position:absolute;right:42px;top:50%;transform:translateY(-50%)" title="End Session">
      <svg viewBox="0 0 20 20" style="width:18px;height:18px">
        <rect x="5" y="5" width="10" height="10" rx="2" stroke="#1d1d1f" fill="none" stroke-width="1.5"/>
      </svg>
    </button>
    <!-- Manage -->
    <button class="nav-btn" onclick="openMeetingManage()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%)">
      <svg viewBox="0 0 20 20" style="width:20px;height:20px">
        <path d="M4 6h12M4 10h12M4 14h12" stroke="#1d1d1f" fill="none" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Scrollable story body -->
  <div class="screen-body mtg-write-scroll" id="meetingWriteBody"></div>

  <!-- Bottom input bar with edit banner -->
  <div class="mtg-write-bar">
    <!-- Edit banner (hidden by default, shown when editing) -->
    <div class="mtg-edit-banner" id="mtgEditBanner" style="display:none"></div>
    <!-- Input row -->
    <div class="mtg-write-bar-row">
      <textarea class="mtg-write-input" id="meetingWriteInput" rows="1"
                data-i18n-placeholder="meetingInputPh" placeholder="Enter message..."></textarea>
      <button class="mtg-write-send" id="meetingWriteSendBtn" onclick="meetingWriteSend()">
        <svg viewBox="0 0 20 20" style="width:16px;height:16px">
          <path d="M4 10h12M11 5l5 5-5 5" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

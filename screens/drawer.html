<!-- DRAWER -->
<div class="drawer-mask" id="drawerMask" onclick="if(event.target===this)closeDrawer()">
	<div class="drawer-panel">
		<div class="drawer-header">
			<h3>筛选</h3>
			<button class="drawer-close" onclick="closeDrawer()">
				<svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke-linecap="round"/></svg>
			</button>
		</div>
		<div class="drawer-search">
			<svg viewBox="0 0 18 18"><circle cx="8" cy="8" r="5.5"/><path d="M12 12l4 4"/></svg>
			<input placeholder="搜索..." id="drawerSearchInput" oninput="applyDrawerFilter()"/>
		</div>
		<div class="drawer-section">显示</div>
		<div class="drawer-item active" data-filter="all" onclick="setDrawerFilter(this,'all')">
			<svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke-linecap="round"/></svg>
			<span>全部</span>
			<span class="drawer-count" id="drawerCountAll">0</span>
		</div>
		<div class="drawer-item" data-filter="unread" onclick="setDrawerFilter(this,'unread')">
			<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="4"/></svg>
			<span>未读</span>
			<span class="drawer-count" id="drawerCountUnread">0</span>
		</div>
		<div class="drawer-item" data-filter="hasChat" onclick="setDrawerFilter(this,'hasChat')">
			<svg viewBox="0 0 20 20"><path d="M4 4h12a2 2 0 012 2v6a2 2 0 01-2 2H8l-4 3v-3a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>
			<span>有消息</span>
			<span class="drawer-count" id="drawerCountChat">0</span>
		</div>
		<div class="drawer-section">排序</div>
		<div class="drawer-item active" data-sort="recent" onclick="setDrawerSort(this,'recent')">
			<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg>
			<span>最近</span>
		</div>
		<div class="drawer-item" data-sort="name" onclick="setDrawerSort(this,'name')">
			<svg viewBox="0 0 20 20"><path d="M4 5h8M4 10h12M4 15h5"/></svg>
			<span>A-Z</span>
		</div>
	</div>
</div>

<!-- ====== MEETING SETTINGS — New Session ====== -->
<div class="screen" id="screen-meeting-settings">
  <div class="nav-bar">
    <button class="nav-btn" onclick="exitMeetingSettings()">
      <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="nav-title" data-i18n="meetingNewSession">New Session</span>
    <div style="width:32px"></div>
  </div>
  <div class="large-title" data-i18n="meetingNewSession">New Session</div>

  <div class="screen-body" style="padding-bottom:40px">

    <!-- 1. Session Name -->
    <div class="mtg-panel-section-hdr" data-i18n="meetingSessionName">SESSION NAME</div>
    <div class="mtg-panel-card">
      <div class="mtg-panel-row">
        <input type="text" class="mtg-panel-text-input" id="mtgSetSessionName"
               data-i18n="meetingSessionNamePh" placeholder="Enter session name">
      </div>
    </div>

    <!-- 2. Mode -->
    <div class="mtg-panel-section-hdr" data-i18n="meetingMode">MODE</div>
    <div class="mtg-panel-card">
      <div class="mtg-panel-col-row">
        <div class="mtg-seg" id="mtgSetModeSeg">
          <div class="mtg-seg-opt active" data-value="continue" onclick="mtgSetToggleSeg(this);mtgSetModeChanged()">
            <span data-i18n="meetingContinue">Continue</span>
          </div>
          <div class="mtg-seg-opt" data-value="if" onclick="mtgSetToggleSeg(this);mtgSetModeChanged()">
            <span data-i18n="meetingIF">IF</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Perspective -->
    <div class="mtg-panel-section-hdr" data-i18n="meetingCharPerspective">PERSPECTIVE</div>
    <div class="mtg-panel-card">

      <!-- Character perspective -->
      <div class="mtg-panel-col-row">
        <div class="mtg-panel-sublabel" data-i18n="meetingCharPerspectiveShort">Character</div>
        <div class="mtg-seg" id="mtgSetCharPersonSeg">
          <div class="mtg-seg-opt active" data-value="first" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingFirstPerson">First</span>
          </div>
          <div class="mtg-seg-opt" data-value="second" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingSecondPerson">Second</span>
          </div>
          <div class="mtg-seg-opt" data-value="third" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingThirdPerson">Third</span>
          </div>
        </div>
      </div>

      <div class="mtg-panel-divider"></div>

      <!-- User perspective -->
      <div class="mtg-panel-col-row">
        <div class="mtg-panel-sublabel" data-i18n="meetingUserPerspectiveShort">User</div>
        <div class="mtg-seg" id="mtgSetUserPersonSeg">
          <div class="mtg-seg-opt active" data-value="first" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingFirstPerson">First</span>
          </div>
          <div class="mtg-seg-opt" data-value="second" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingSecondPerson">Second</span>
          </div>
          <div class="mtg-seg-opt" data-value="third" onclick="mtgSetToggleSeg(this)">
            <span data-i18n="meetingThirdPerson">Third</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. Word Count -->
    <div class="mtg-panel-section-hdr" data-i18n="meetingWordCount">WORD COUNT</div>
    <div class="mtg-panel-card">
      <div class="mtg-panel-row">
        <span class="mtg-panel-label" data-i18n="meetingMin">Min</span>
        <input type="number" class="mtg-panel-num" id="mtgSetWcMin" value="100" min="10" max="2000">
      </div>
      <div class="mtg-panel-divider"></div>
      <div class="mtg-panel-row">
        <span class="mtg-panel-label" data-i18n="meetingMax">Max</span>
        <input type="number" class="mtg-panel-num" id="mtgSetWcMax" value="300" min="10" max="5000">
      </div>
    </div>

    <!-- 5. Characters -->
    <div class="mtg-panel-section-hdr" data-i18n="meetingCharacters">CHARACTERS</div>
    <div class="mtg-panel-card">
      <!-- JS: mtgSetRenderCharSelect() renders mtg-char-item list here -->
      <div class="mtg-char-list" id="mtgSetCharSelect"></div>
    </div>

    <!-- 6. Turn Summary -->
    <div class="mtg-panel-section-hdr" data-i18n="meetingTurnSummary">TURN SUMMARY</div>
    <div class="mtg-panel-card">
      <div class="mtg-panel-row">
        <span class="mtg-panel-label" data-i18n="meetingTurnSummaryEnable">Enable turn summary</span>
        <div class="mtg-toggle" id="mtgSetToggleSummary"
             onclick="this.classList.toggle('active');mtgSetSummaryToggled()"></div>
      </div>
      <div id="mtgSetSummaryIntervalWrap" style="display:none">
        <div class="mtg-panel-divider"></div>
        <div class="mtg-panel-row">
          <span class="mtg-panel-label" data-i18n="meetingSummaryInterval">Interval (turns)</span>
          <input type="number" class="mtg-panel-num" id="mtgSetSummaryInterval" value="5" min="2" max="50">
        </div>
      </div>
    </div>

    <!-- 7. Worldview (IF only) -->
    <div class="mtg-set-if-only" id="mtgSetWorldviewField" style="display:none">
      <div class="mtg-panel-section-hdr" data-i18n="meetingWorldview">WORLDVIEW</div>
      <div class="mtg-panel-card">
        <div class="mtg-panel-col-row">
          <textarea class="mtg-panel-textarea" id="mtgSetWorldview" rows="3"
                    data-i18n="meetingWorldviewPh" placeholder="Describe the world setting..."></textarea>
        </div>
      </div>
    </div>

    <!-- 8. Identity (IF only) -->
    <div class="mtg-set-if-only" id="mtgSetIdentityField" style="display:none">
      <div class="mtg-panel-section-hdr" data-i18n="meetingIdentity">IDENTITY</div>
      <div class="mtg-panel-card">
        <div class="mtg-panel-col-row">
          <textarea class="mtg-panel-textarea" id="mtgSetIdentity" rows="3"
                    data-i18n="meetingIdentityPh" placeholder="Your character identity..."></textarea>
        </div>
      </div>
    </div>

    <!-- ★★★ NEW: 9. Options — No NSFW / Anti-interrupt ★★★ -->
    <div class="mtg-panel-section-hdr" data-i18n="meetingOptionsSection">OPTIONS</div>
    <div class="mtg-panel-card">
      <!-- No NSFW Content toggle -->
      <div class="mtg-panel-row">
        <div class="mtg-panel-label-with-icon">
          <svg viewBox="0 0 16 16" class="mtg-panel-label-icon">
            <path d="M8 1L1 5v6l7 4 7-4V5L8 1z" stroke="#86868b" fill="none" stroke-width="1.3" stroke-linejoin="round"/>
            <path d="M5 8l2 2 4-4" stroke="#86868b" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-i18n="meetingNoNSFW">No NSFW Content</span>
        </div>
        <div class="mtg-toggle" id="mtgSetToggleNoNSFW"
             onclick="this.classList.toggle('active');mtgSetNoNSFWToggled()"></div>
      </div>
      <div class="mtg-panel-divider"></div>
      <!-- Anti-interrupt toggle -->
      <div class="mtg-panel-row">
        <div class="mtg-panel-label-with-icon">
          <svg viewBox="0 0 16 16" class="mtg-panel-label-icon">
            <circle cx="8" cy="8" r="6" stroke="#86868b" fill="none" stroke-width="1.3"/>
            <path d="M8 5v4" stroke="#86868b" fill="none" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="8" cy="11.5" r=".7" fill="#86868b"/>
          </svg>
          <span data-i18n="meetingAntiInterrupt">Anti-interrupt</span>
        </div>
        <div class="mtg-toggle" id="mtgSetToggleAntiInterrupt"
             onclick="this.classList.toggle('active');mtgSetAntiInterruptToggled()"></div>
      </div>
    </div>
    <!-- ★★★ END NEW ★★★ -->

    <!-- Start Button -->
    <div style="padding:24px 16px 0">
      <button class="mtg-panel-primary-btn" onclick="startMeetingSession()">
        <svg viewBox="0 0 20 20" style="width:16px;height:16px;margin-right:6px">
          <path d="M6 4l10 6-10 6z" stroke="#fff" fill="none" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="meetingStart">Start</span>
      </button>
    </div>

  </div>
</div>

<!-- WIKI -->
<div class="screen" id="screen-wiki">
	<div class="nav-bar">
		<button class="nav-btn" id="wiki-nav-back-btn" onclick="wikiNavBack()">
			<svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
		</button>
		<span class="nav-title" id="wiki-nav-title" data-i18n="wiki.title">Wiki</span>
		<button class="nav-btn nav-right" id="wiki-nav-add-btn" onclick="wikiNavAddAction()">
			<svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
		</button>
	</div>
	<div class="large-title" id="wiki-large-title" data-i18n="wiki.title">Wiki</div>

	<!-- ====================================================================
	     VIEW 1 — Character List (Primary)
	     ==================================================================== -->
	<div class="wiki-view wiki-view-active" id="wiki-list-view">
		<div class="screen-body">
			<!-- Search -->
			<div class="wiki-search-wrap">
				<svg viewBox="0 0 18 18" class="wiki-search-icon"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 12l4 4" stroke="currentColor" fill="none" stroke-width="1.5"/></svg>
				<input class="wiki-search-input" id="wiki-search-input" data-i18n-ph="wiki.searchCharacters" placeholder="Search characters..." oninput="filterWikiCharacters(this.value)"/>
			</div>

			<!-- Character Grid -->
			<div class="wiki-section-label">
				<svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 14c0-3 2.7-5 6-5s6 2 6 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
				<span data-i18n="wiki.characters">CHARACTERS</span>
			</div>
			<div class="wiki-char-grid" id="wiki-char-grid">
				<!-- JS renders cards here -->
			</div>

			<!-- Empty State -->
			<div class="wiki-empty" id="wiki-list-empty" style="display:none">
				<svg viewBox="0 0 48 48">
					<circle cx="24" cy="18" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
					<path d="M10 40c0-8 6-13 14-13s14 5 14 13" fill="none" stroke="currentColor" stroke-width="1.5"/>
				</svg>
				<p data-i18n="wiki.noCharacters">No characters yet</p>
				<span data-i18n="wiki.noCharactersSub">Create characters in iMessage first</span>
			</div>
			<div style="height:40px"></div>
		</div>
	</div>

	<!-- ====================================================================
	     VIEW 2 — Character Detail (Secondary)
	     ==================================================================== -->
	<div class="wiki-view" id="wiki-detail-view">
		<div class="screen-body">
			<!-- Detail Header -->
			<div class="wiki-detail-header">
				<div class="wiki-detail-avatar" id="wiki-detail-avatar">
					<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 22c0-4.5 3.5-8 8-8s8 3.5 8 8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
				</div>
				<div class="wiki-detail-name" id="wiki-detail-name">—</div>
			</div>

			<!-- Detail Tab Bar -->
			<div class="wiki-detail-tab-bar">
				<button class="wiki-detail-tab active" data-dtab="npc" onclick="switchWikiDetailTab('npc')">
					<svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 14c0-3 2.7-5 6-5s6 2 6 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
					<span data-i18n="wiki.tab.npc">NPC</span>
				</button>
				<button class="wiki-detail-tab" data-dtab="relationships" onclick="switchWikiDetailTab('relationships')">
					<svg viewBox="0 0 16 16"><path d="M2 8h3l2-3 3 6 2-3h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
					<span data-i18n="wiki.tab.relationships">Relationships</span>
				</button>
				<button class="wiki-detail-tab" data-dtab="schedule" onclick="switchWikiDetailTab('schedule')">
					<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 1v3M11 1v3M2 7h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
					<span data-i18n="wiki.tab.schedule">Schedule</span>
				</button>
			</div>

			<!-- ── NPC Tab ── -->
			<div class="wiki-detail-panel wiki-panel-visible" id="wiki-detail-npc">
				<div class="wiki-npc-card" id="wiki-npc-content">
					<!-- JS fills profile fields here -->
				</div>
			</div>

			<!-- ── Relationships Tab ── -->
			<div class="wiki-detail-panel" id="wiki-detail-relationships">
				<div class="wiki-rel-empty" id="wiki-rel-content">
					<svg viewBox="0 0 60 40" class="wiki-rel-icon">
						<circle cx="15" cy="15" r="8" fill="none" stroke="currentColor" stroke-width="1"/>
						<circle cx="45" cy="15" r="8" fill="none" stroke="currentColor" stroke-width="1"/>
						<circle cx="30" cy="32" r="6" fill="none" stroke="currentColor" stroke-width="1"/>
						<path d="M22 18l5 11M38 18l-5 11M23 15h14" stroke="currentColor" fill="none" stroke-width="1" stroke-dasharray="2 2"/>
					</svg>
					<p data-i18n="wiki.relationships.empty">No relationships defined</p>
					<span data-i18n="wiki.relationships.emptySub">Connect characters and NPCs</span>
				</div>
				<div style="padding:0 16px 16px">
					<button class="wiki-btn-primary" onclick="console.log('Add Relationship')">
						<svg viewBox="0 0 16 16"><path d="M2 8h3l2-3 3 6 2-3h3" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
						<span data-i18n="wiki.relationships.add">Add Relationship</span>
					</button>
				</div>
			</div>

			<!-- ── Schedule Tab ── -->
			<div class="wiki-detail-panel" id="wiki-detail-schedule">
				<div class="schedule-header">
					<div class="schedule-header-left">
						<svg class="schedule-header-icon" viewBox="0 0 16 16">
							<rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
							<path d="M5 1v3M11 1v3M2 7h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
						</svg>
						<span data-i18n="wiki.schedule.title">Schedule</span>
					</div>
					<button class="schedule-add-btn" onclick="openScheduleAddModal()">
						<svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
						<span data-i18n="wiki.schedule.add">Add</span>
					</button>
				</div>

				<div class="schedule-filter-bar">
					<button class="schedule-filter active" data-filter="all" onclick="filterSchedule('all')" data-i18n="wiki.schedule.filterAll">All</button>
					<button class="schedule-filter" data-filter="pending" onclick="filterSchedule('pending')" data-i18n="wiki.schedule.filterPending">Pending</button>
					<button class="schedule-filter" data-filter="completed" onclick="filterSchedule('completed')" data-i18n="wiki.schedule.filterCompleted">Completed</button>
				</div>

				<div class="schedule-timeline" id="schedule-timeline">
					<!-- JS renders -->
				</div>
			</div>

			<div style="height:40px"></div>
		</div>
	</div>

	<!-- ====================================================================
	     Modal — Add Schedule Event (Centered)
	     ==================================================================== -->
	<div class="wiki-modal-overlay" id="schedule-add-modal">
		<div class="wiki-modal-backdrop" onclick="closeScheduleAddModal()"></div>
		<div class="wiki-modal wiki-modal-center">
			<div class="wiki-modal-header">
				<span class="wiki-modal-title" data-i18n="wiki.schedule.addEvent">Add Schedule Event</span>
				<button class="wiki-modal-close" onclick="closeScheduleAddModal()">
					<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"/></svg>
				</button>
			</div>
			<div class="wiki-modal-body">
				<div class="modal-field">
					<label class="modal-field-label" data-i18n="wiki.schedule.eventTitle">Event Title</label>
					<input type="text" class="modal-field-input" id="sched-add-title" data-i18n-ph="wiki.schedule.eventTitlePh" placeholder="Enter event title..."/>
				</div>
				<div class="modal-field-row">
					<div class="modal-field" style="flex:1">
						<label class="modal-field-label" data-i18n="wiki.schedule.date">Date</label>
						<input type="date" class="modal-field-input" id="sched-add-date"/>
					</div>
					<div class="modal-field" style="flex:1">
						<label class="modal-field-label" data-i18n="wiki.schedule.time">Time</label>
						<input type="time" class="modal-field-input" id="sched-add-time"/>
					</div>
				</div>
				<div class="modal-field">
					<label class="modal-field-label" data-i18n="wiki.schedule.characters">Characters</label>
					<div class="modal-tag-select" id="sched-add-chars">
						<!-- JS renders character tags here -->
					</div>
				</div>
				<div class="modal-field">
					<label class="modal-field-label" data-i18n="wiki.schedule.description">Description</label>
					<textarea class="modal-field-textarea" id="sched-add-desc" rows="3" data-i18n-ph="wiki.schedule.descriptionPh" placeholder="Brief description of this event..."></textarea>
				</div>
			</div>
			<div class="wiki-modal-footer">
				<button class="wiki-modal-btn-outline" onclick="closeScheduleAddModal()" data-i18n="wiki.cancel">Cancel</button>
				<button class="wiki-modal-btn-outline primary" onclick="saveScheduleEvent()" data-i18n="wiki.save">Save</button>
			</div>
		</div>
	</div>

	<!-- ====================================================================
	     Modal — Schedule Event Detail (Centered)
	     ==================================================================== -->
	<div class="wiki-modal-overlay" id="schedule-detail-modal">
		<div class="wiki-modal-backdrop" onclick="closeScheduleDetailModal()"></div>
		<div class="wiki-modal wiki-modal-center">
			<div class="wiki-modal-header">
				<span class="wiki-modal-title" data-i18n="wiki.schedule.detail">Event Detail</span>
				<button class="wiki-modal-close" onclick="closeScheduleDetailModal()">
					<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"/></svg>
				</button>
			</div>
			<div class="wiki-modal-body" id="schedule-detail-body">
				<!-- JS fills -->
			</div>
			<div class="wiki-modal-footer" id="schedule-detail-footer">
				<!-- JS fills action buttons -->
			</div>
		</div>
	</div>

</div><!-- /#screen-wiki -->

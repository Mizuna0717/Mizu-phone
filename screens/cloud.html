<!-- CLOUD STORAGE -->
<div class="screen" id="screen-cloud">
	<div class="nav-bar">
		<button class="nav-btn" onclick="nav('screen-archive')">
			<svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#1d1d1f" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
		</button>
		<span class="nav-title">Cloud Storage</span>
	</div>
	<div class="large-title">云端存储</div>
	<div class="screen-body">

		<!-- Hero -->
		<div style="margin:0 16px 24px;background:linear-gradient(135deg,#1d1d1f,#3a3a3c);border-radius:20px;padding:28px 24px;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.2)">
			<div style="position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.03)"></div>
			<div style="display:flex;align-items:center;gap:14px;position:relative">
				<div style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0">
					<svg viewBox="0 0 24 24" style="width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M6.5 19A4.5 4.5 0 016 10.3 6 6 0 0118 11a3.5 3.5 0 01.5 6.5"/><path d="M8 19h8"/></svg>
				</div>
				<div>
					<div style="font-size:18px;font-weight:700;margin-bottom:2px">Cloud Backup</div>
					<div style="font-size:12px;color:rgba(255,255,255,.45)">Sync your data across devices</div>
				</div>
			</div>
		</div>

		<!-- ★★★ Supabase 配置区域 ★★★ -->
		<div style="padding:4px 20px 8px;font-size:13px;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:flex;align-items:center;gap:8px">
			<svg viewBox="0 0 20 20" style="width:14px;height:14px;stroke:#8e8e93;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M10 2a3 3 0 00-3 3v2H5a2 2 0 00-2 2v7a2 2 0 002 2h10a2 2 0 002-2V9a2 2 0 00-2-2h-2V5a3 3 0 00-3-3zm0 1.5A1.5 1.5 0 0111.5 5v2h-3V5A1.5 1.5 0 0110 3.5z"/></svg>
			<span>连接配置</span>
		</div>
		<div style="margin:0 16px 16px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ececec;box-shadow:0 1px 4px rgba(0,0,0,.04)">
			<!-- Supabase URL -->
			<div style="padding:14px 16px;border-bottom:1px solid #f2f2f7">
				<div style="font-size:12px;color:#8e8e93;margin-bottom:6px;font-weight:500">Supabase URL</div>
				<input id="cloudSupabaseUrl" type="text" placeholder="https://xxxxx.supabase.co" autocomplete="off" autocapitalize="off" spellcheck="false"
					style="width:100%;border:none;outline:none;font-size:14px;color:#1d1d1f;background:transparent;font-family:inherit;padding:0">
			</div>
			<!-- Anon Key -->
			<div style="padding:14px 16px;border-bottom:1px solid #f2f2f7">
				<div style="font-size:12px;color:#8e8e93;margin-bottom:6px;font-weight:500">Anon Key</div>
				<div style="display:flex;align-items:center;gap:8px">
					<input id="cloudAnonKey" type="password" placeholder="eyJhbGciOiJIUzI1NiIs..." autocomplete="off" autocapitalize="off" spellcheck="false"
						style="flex:1;border:none;outline:none;font-size:14px;color:#1d1d1f;background:transparent;font-family:monospace;padding:0">
					<button id="cloudKeyToggle" onclick="toggleCloudKeyVisibility()" style="background:none;border:none;cursor:pointer;padding:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center">
						<svg id="cloudKeyEyeIcon" viewBox="0 0 20 20" style="width:18px;height:18px;stroke:#8e8e93;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round">
							<path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z"/>
							<circle cx="10" cy="10" r="3"/>
						</svg>
					</button>
				</div>
			</div>
			<!-- 按钮行 -->
			<div style="display:flex;border-top:none">
				<button onclick="saveCloudConfig()" style="flex:1;padding:13px;border:none;background:none;font-size:14px;color:#1d1d1f;font-weight:600;cursor:pointer;font-family:inherit;border-right:1px solid #f2f2f7;transition:background .12s" onmousedown="this.style.background='#f2f2f7'" onmouseup="this.style.background=''" onmouseleave="this.style.background=''">
					保存配置
				</button>
				<button onclick="testCloudConnection()" style="flex:1;padding:13px;border:none;background:none;font-size:14px;color:#636366;font-weight:500;cursor:pointer;font-family:inherit;transition:background .12s" onmousedown="this.style.background='#f2f2f7'" onmouseup="this.style.background=''" onmouseleave="this.style.background=''">
					测试连接
				</button>
			</div>
		</div>

		<!-- 上传卡片 -->
		<div id="cloudUploadCard" style="margin:0 16px 12px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ececec;box-shadow:0 1px 4px rgba(0,0,0,.04)">
			<div id="cloudUploadBtn" onclick="cloudUpload()" style="display:flex;align-items:center;padding:18px 16px;gap:14px;cursor:pointer;transition:background .15s;opacity:.45;pointer-events:none" onmousedown="this.style.background='#f2f2f7'" onmouseup="this.style.background=''" onmouseleave="this.style.background=''">
				<div style="width:44px;height:44px;border-radius:12px;background:#f2f2f7;display:flex;align-items:center;justify-content:center;flex-shrink:0">
					<svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:#3a3a3c;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M6.5 19A4.5 4.5 0 016 10.3 6 6 0 0118 11a3.5 3.5 0 01.5 6.5"/><path d="M12 13v-7"/><path d="M9 9l3-3 3 3"/></svg>
				</div>
				<div style="flex:1">
					<div style="font-size:16px;font-weight:600;color:#1d1d1f">上传至云端</div>
					<div id="cloudUploadSub" style="font-size:12px;color:#8e8e93;margin-top:3px">请先配置云端连接</div>
				</div>
				<svg viewBox="0 0 20 20" style="width:14px;height:14px;stroke:#c7c7cc;fill:none;stroke-width:2;flex-shrink:0"><path d="M8 4l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
			</div>
		</div>

		<!-- 下载卡片 -->
		<div id="cloudDownloadCard" style="margin:0 16px 12px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ececec;box-shadow:0 1px 4px rgba(0,0,0,.04)">
			<div id="cloudDownloadBtn" onclick="cloudDownload()" style="display:flex;align-items:center;padding:18px 16px;gap:14px;cursor:pointer;transition:background .15s;opacity:.45;pointer-events:none" onmousedown="this.style.background='#f2f2f7'" onmouseup="this.style.background=''" onmouseleave="this.style.background=''">
				<div style="width:44px;height:44px;border-radius:12px;background:#f2f2f7;display:flex;align-items:center;justify-content:center;flex-shrink:0">
					<svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:#3a3a3c;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M6.5 19A4.5 4.5 0 016 10.3 6 6 0 0118 11a3.5 3.5 0 01.5 6.5"/><path d="M12 13v7"/><path d="M9 17l3 3 3-3"/></svg>
				</div>
				<div style="flex:1">
					<div style="font-size:16px;font-weight:600;color:#1d1d1f">从云端下载</div>
					<div id="cloudDownloadSub" style="font-size:12px;color:#8e8e93;margin-top:3px">请先配置云端连接</div>
				</div>
				<svg viewBox="0 0 20 20" style="width:14px;height:14px;stroke:#c7c7cc;fill:none;stroke-width:2;flex-shrink:0"><path d="M8 4l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
			</div>
		</div>

		<!-- 云端状态 -->
		<div style="margin:24px 16px 8px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ececec;box-shadow:0 1px 4px rgba(0,0,0,.04)">
			<div style="padding:16px">
				<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
					<svg viewBox="0 0 20 20" style="width:16px;height:16px;stroke:#8e8e93;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><circle cx="10" cy="10" r="8"/><path d="M10 6v4l2.5 1.5"/></svg>
					<span style="font-size:13px;color:#8e8e93;font-weight:600;text-transform:uppercase;letter-spacing:.3px">同步状态</span>
				</div>
				<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f9f9f9;border-radius:10px;margin-bottom:10px">
					<div id="cloudStatusDot" style="width:8px;height:8px;border-radius:50%;background:#c7c7cc;flex-shrink:0"></div>
					<span id="cloudStatusText" style="font-size:14px;color:#636366;font-weight:500">未连接云端</span>
				</div>
				<div style="display:flex;justify-content:space-between;align-items:center;padding:0 4px">
					<div><div style="font-size:11px;color:#c7c7cc;margin-bottom:2px">上次上传</div><div id="cloudLastUpload" style="font-size:13px;color:#8e8e93;font-weight:500">暂无</div></div>
					<div style="width:1px;height:28px;background:#ececec"></div>
					<div><div style="font-size:11px;color:#c7c7cc;margin-bottom:2px">上次下载</div><div id="cloudLastDownload" style="font-size:13px;color:#8e8e93;font-weight:500">暂无</div></div>
					<div style="width:1px;height:28px;background:#ececec"></div>
					<div><div style="font-size:11px;color:#c7c7cc;margin-bottom:2px">数据大小</div><div id="cloudDataSize" style="font-size:13px;color:#8e8e93;font-weight:500">--</div></div>
				</div>
			</div>
		</div>

		<!-- 备份列表（下载时动态填充） -->
		<div id="cloudBackupListArea" style="display:none;margin:16px 16px 8px">
			<div style="font-size:13px;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px">
				<svg viewBox="0 0 20 20" style="width:14px;height:14px;stroke:#8e8e93;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M3 3h14v14H3z" rx="2"/><path d="M7 3v14M3 7h14"/></svg>
				<span>云端备份列表</span>
			</div>
			<div id="cloudBackupList" style="background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ececec"></div>
		</div>

		<div style="margin:16px 32px 12px;font-size:12px;color:#8e8e93;line-height:1.5;text-align:center">
			数据通过 Supabase Storage 加密传输。请在 Supabase 控制台预先创建名为 app_backup 的存储桶。
		</div>
		<div style="height:40px"></div>
	</div>
</div>

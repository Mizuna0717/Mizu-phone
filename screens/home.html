<!-- HOME -->
<div class="screen active" id="screen-home">
	<div style="flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#eaeaef 0%,#dddde2 100%)">
		<div class="home-pages" id="homePages">
			<!-- PAGE 1 -->
			<div class="home-page" id="homePage1">
				<div class="profile-widget">
					<div class="pw-banner" onclick="document.getElementById('homeBannerInput').click()">
						<img id="homeBannerImg" style="display:none">
						<button class="pw-banner-edit"><svg viewBox="0 0 14 14"><path d="M10 1.5l2.5 2.5M1.5 10V13h2.5L11.5 5.5 9 3 1.5 10z"/></svg></button>
						<input type="file" id="homeBannerInput" accept="image/*" onchange="setHomeBanner(this)" style="display:none">
					</div>
					<div class="pw-glass">
						<div class="pw-avatar" onclick="document.getElementById('homeAvatarInput').click()">
							<svg viewBox="0 0 32 32" id="homeAvatarPh"><circle cx="16" cy="12" r="5"/><path d="M6 28c0-6 4-10 10-10s10 4 10 10"/></svg>
							<img id="homeAvatarImg" style="display:none">
							<input type="file" id="homeAvatarInput" accept="image/*" onchange="setHomeAvatar(this)" style="display:none">
						</div>
						<div class="pw-name" id="homeUserName" onclick="startEditHomeName()">User</div>
						<div class="pw-bio" id="homeUserBio" onclick="startEditHomeBio()">Tap to add signature</div>
					</div>
				</div>
				<div class="home-icon-row">
					<div class="app-icon-wrap" onclick="nav('screen-imessage')">
						<div class="app-icon"><svg viewBox="0 0 32 32"><path d="M6 6h20a2 2 0 012 2v12a2 2 0 01-2 2H12l-6 4v-4a2 2 0 01-2-2V8a2 2 0 012-2z"/><circle cx="11" cy="14" r="1.2" fill="#3a3a3c" stroke="none"/><circle cx="16" cy="14" r="1.2" fill="#3a3a3c" stroke="none"/><circle cx="21" cy="14" r="1.2" fill="#3a3a3c" stroke="none"/></svg></div>
						<span class="app-label">iMessage</span>
						<div class="home-badge" id="homeMsgBadge"></div>
					</div>
					<div class="app-icon-wrap" onclick="nav('screen-worldbook')"><div class="app-icon"><svg viewBox="0 0 32 32"><path d="M4 4h8a4 4 0 014 4v20s-2-4-8-4H4V4z"/><path d="M28 4h-8a4 4 0 00-4 4v20s2-4 8-4h4V4z"/></svg></div><span class="app-label" data-i18n="wordbook">Wordbook</span></div>
					<div class="app-icon-wrap" onclick="enterPhoneScreen()"><div class="app-icon"><svg viewBox="0 0 32 32"><rect x="8" y="3" width="16" height="26" rx="3"/><path d="M14 6h4"/><circle cx="16" cy="25" r="1.5"/><path d="M8 8h16M8 23h16"/></svg></div><span class="app-label">Phone</span></div>
					<div class="app-icon-wrap" onclick="nav('screen-couple')"><div class="app-icon"><svg viewBox="0 0 32 32"><path d="M16 28C16 28 5 21 5 13a6 6 0 0111-3.3A6 6 0 0127 13c0 8-11 15-11 15z"/></svg></div><span class="app-label">Couple</span></div>
					<div class="app-icon-wrap" onclick="nav('screen-meeting')">
						<div class="app-icon">
							<svg viewBox="0 0 32 32">
								<circle cx="16" cy="8" r="3.5"/>
								<path d="M9 24c0-3.9 3.1-7 7-7s7 3.1 7 7"/>
								<circle cx="6" cy="13" r="2.5"/>
								<path d="M1 23c0-2.8 2.2-5 5-5 1.2 0 2.3.4 3.1 1.1"/>
								<circle cx="26" cy="13" r="2.5"/>
								<path d="M31 23c0-2.8-2.2-5-5-5-1.2 0-2.3.4-3.1 1.1"/>
							</svg>
						</div>
						<span class="app-label">Meeting</span>
					</div>
					<div class="app-icon-wrap" onclick="nav('screen-game')"><div class="app-icon"><svg viewBox="0 0 32 32"><rect x="3" y="8" width="26" height="17" rx="4"/><circle cx="10" cy="16" r="3"/><path d="M10 14v4M8 16h4"/><circle cx="21" cy="14" r="1.2" fill="#3a3a3c" stroke="none"/><circle cx="24" cy="17" r="1.2" fill="#3a3a3c" stroke="none"/><circle cx="21" cy="20" r="1.2" fill="#3a3a3c" stroke="none"/><circle cx="18" cy="17" r="1.2" fill="#3a3a3c" stroke="none"/></svg></div><span class="app-label">Game</span></div>
				</div>
			</div>
			<!-- PAGE 2 -->
			<div class="home-page" id="homePage2">
				<div class="greeting-widget" onclick="document.getElementById('greetingBgInput').click()">
					<div class="gw-bg"><img id="greetingBgImg" style="display:none"></div>
					<button class="gw-edit"><svg viewBox="0 0 12 12"><path d="M8.5 1.5l2 2M1 8.5V11h2.5L10 4.5l-2-2L1 8.5z"/></svg></button>
					<input type="file" id="greetingBgInput" accept="image/*" onchange="setGreetingBg(this)" style="display:none">
					<div class="gw-content">
						<div class="gw-icon"><svg viewBox="0 0 28 28"><circle cx="14" cy="10" r="5"/><path d="M14 3v1M14 17v1M7 10H6M22 10h-1"/><path d="M8 20c0-2 2-4 4-4h4c2 0 4 2 4 4"/></svg></div>
						<div class="gw-title" id="greetingText">Good Evening</div>
						<div class="gw-sub">Have a nice day.</div>
						<div class="gw-dots" id="greetingDots"></div>
					</div>
				</div>
				<div class="p2-grid">
					<div class="p2-left">
						<div class="music-widget">
							<div class="mw-cover" onclick="document.getElementById('musicCoverInput').click()">
								<img id="musicCoverImg" style="display:none">
								<button class="mw-cover-edit"><svg viewBox="0 0 10 10"><path d="M7 1l2 2M1 7V9h2L8 4 6 2 1 7z"/></svg></button>
								<input type="file" id="musicCoverInput" accept="image/*" onchange="setMusicCover(this)" style="display:none">
							</div>
							<div class="mw-info">
								<div class="mw-song" id="musicSong" onclick="editMusicInfo('song')">Song Title</div>
								<div class="mw-artist" id="musicArtist" onclick="editMusicInfo('artist')">Artist</div>
							</div>
							<div class="mw-controls">
								<svg viewBox="0 0 18 18"><path d="M13 3l-8 6 8 6V3z"/><path d="M4 3v12"/></svg>
								<svg viewBox="0 0 18 18"><rect x="3" y="3" width="4" height="12" rx="1"/><rect x="11" y="3" width="4" height="12" rx="1"/></svg>
								<svg viewBox="0 0 18 18"><path d="M5 3l8 6-8 6V3z"/><path d="M14 3v12"/></svg>
							</div>
							<div class="mw-progress"><div class="mw-progress-bar"></div><div class="mw-progress-dot"></div></div>
						</div>
						<div class="p2-mini-grid">
							<div class="app-icon-wrap" onclick="nav('screen-forum')"><div class="app-icon"><svg viewBox="0 0 32 32"><path d="M6 6h14a2 2 0 012 2v8a2 2 0 01-2 2H12l-4 3v-3H6a2 2 0 01-2-2V8a2 2 0 012-2z"/><path d="M22 12h4a2 2 0 012 2v8a2 2 0 01-2 2h-2v3l-4-3h-6a2 2 0 01-2-2v-2"/></svg></div><span class="app-label">Forum</span></div>
							<div class="app-icon-wrap" onclick="nav('screen-ao3')"><div class="app-icon"><svg viewBox="0 0 32 32"><path d="M8 4h16a2 2 0 012 2v20l-5-3H8a2 2 0 01-2-2V6a2 2 0 012-2z"/><path d="M10 10h12M10 14h10M10 18h6"/></svg></div><span class="app-label">AO3</span></div>
							<div class="app-icon-wrap" onclick=""><div class="app-icon blank-icon"><svg viewBox="0 0 32 32"><path d="M16 11v10M11 16h10" stroke-linecap="round" stroke-width="1.2"/></svg></div><span class="app-label blank-label">—</span></div>
							<div class="app-icon-wrap" onclick="nav('screen-memory')"><div class="app-icon"><svg viewBox="0 0 32 32"><rect x="6" y="4" width="20" height="24" rx="3"/><rect x="9" y="7" width="14" height="11" rx="1.5"/><path d="M12 23h8"/></svg></div><span class="app-label" data-i18n="memory">Memory</span></div>
						</div>
					</div>
					<div class="p2-right">
						<div class="p2-mini-grid">
							<div class="app-icon-wrap" onclick="nav('screen-wiki')">
								<div class="app-icon">
									<svg viewBox="0 0 32 32">
										<path d="M5 6a2 2 0 012-2h7l2 2h9a2 2 0 012 2v16a2 2 0 01-2 2H7a2 2 0 01-2-2V6z"/>
										<path d="M5 12h22"/>
										<path d="M12 17h8"/>
									</svg>
								</div>
								<span class="app-label" data-i18n="wiki">Wiki</span>
							</div>
							<div class="app-icon-wrap" onclick=""><div class="app-icon blank-icon"><svg viewBox="0 0 32 32"><path d="M16 11v10M11 16h10" stroke-linecap="round" stroke-width="1.2"/></svg></div><span class="app-label blank-label">—</span></div>
							<div class="app-icon-wrap" onclick=""><div class="app-icon blank-icon"><svg viewBox="0 0 32 32"><path d="M16 11v10M11 16h10" stroke-linecap="round" stroke-width="1.2"/></svg></div><span class="app-label blank-label">—</span></div>
							<div class="app-icon-wrap" onclick="nav('screen-dice')"><div class="app-icon"><svg viewBox="0 0 32 32"><rect x="5" y="5" width="22" height="22" rx="4"/><circle cx="11" cy="11" r="1.5" fill="#6e6e73" stroke="none"/><circle cx="21" cy="11" r="1.5" fill="#6e6e73" stroke="none"/><circle cx="16" cy="16" r="1.5" fill="#6e6e73" stroke="none"/><circle cx="11" cy="21" r="1.5" fill="#6e6e73" stroke="none"/><circle cx="21" cy="21" r="1.5" fill="#6e6e73" stroke="none"/></svg></div><span class="app-label">Dice</span></div>
						</div>
						<div class="calendar-widget">
							<div class="cw-month" id="calMonth">JAN</div>
							<div class="cw-date" id="calDate">17</div>
							<div class="cw-weekday" id="calWeekday">Friday</div>
							<div class="cw-divider"></div>
							<div class="cw-event" id="calEvent" onclick="editCalEvent()">Tap to set event</div>
							<div class="cw-countdown" id="calCountdown" style="display:none">0</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="home-dots">
			<div class="home-dot active" id="homeDot0"></div>
			<div class="home-dot" id="homeDot1"></div>
		</div>
		<div class="home-dock">
			<div class="app-icon-wrap" onclick="nav('screen-archive')">
				<div class="app-icon">
					<svg viewBox="0 0 32 32">
						<rect x="4" y="6" width="24" height="6" rx="2"/>
						<path d="M6 12v14a2 2 0 002 2h16a2 2 0 002-2V12"/>
						<path d="M12 18h8"/>
					</svg>
				</div>
				<span class="app-label" data-i18n="archive">Archive</span>
			</div>
			<div class="app-icon-wrap" onclick="nav('screen-settings')">
				<div class="app-icon">
					<svg viewBox="0 0 32 32">
						<circle cx="16" cy="16" r="6"/>
						<path d="M16 2v4M16 26v4M2 16h4M26 16h4M5.17 5.17l2.83 2.83M23.97 23.97l2.83 2.83M5.17 26.83l2.83-2.83M23.97 8.03l2.83-2.83"/>
					</svg>
				</div>
				<span class="app-label" data-i18n="settings">Settings</span>
			</div>
			<div class="app-icon-wrap" onclick="nav('screen-theme')">
				<div class="app-icon">
					<svg viewBox="0 0 32 32">
						<circle cx="16" cy="16" r="11"/>
						<path d="M16 5v22"/>
						<path d="M16 16c0-6 5-11 11-11"/>
						<path d="M16 16c0 6-5 11-11 11"/>
					</svg>
				</div>
				<span class="app-label" data-i18n="theme">Theme</span>
			</div>
		</div>
	</div>
</div>

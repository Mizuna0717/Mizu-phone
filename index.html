    <!-- ═══════════════════════════════════════════════════════════════
         ★ Mizu Phone v14.1 — 水滴微调
         开场1s → 水滴3s → 涟漪4s → 退场2s = 10s（不变）
         ★ 水滴放大18%、下移7%、颜色加深
         ★ 涟漪使用旧水滴色、确保触底后才扩散
         ═══════════════════════════════════════════════════════════════ -->
    <style>
        /* ════════════════════════════════════════════
           容器（不变）
           ════════════════════════════════════════════ */
        #loadingIndicator {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(
                ellipse at 50% 40%,
                #fcfcfc 0%, #f5f5f5 50%, #ebebeb 100%
            );
            z-index: 99999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter',
                         'Helvetica Neue', system-ui, sans-serif;
            overflow: hidden;
            transition: opacity 1.1s cubic-bezier(.4,0,.15,1),
                        transform 1.1s cubic-bezier(.4,0,.15,1);
        }
        #loadingIndicator.mizu-fadeout {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        /* ════════════════════════════════════════════
           水面光影（不变）
           ════════════════════════════════════════════ */
        .mizu-shimmer {
            position: absolute;
            inset: -60%;
            background: linear-gradient(
                120deg,
                transparent 38%,
                rgba(255,255,255,.04) 46%,
                rgba(255,255,255,.07) 50%,
                rgba(255,255,255,.04) 54%,
                transparent 62%
            );
            background-size: 200% 200%;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            animation:
                mizuFadeIn 4s ease 0.5s forwards,
                mizuShimmerDrift 14s ease-in-out 0.5s infinite;
        }

        /* ════════════════════════════════════════════
           涟漪场景容器（不变）
           ════════════════════════════════════════════ */
        .mizu-scene {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 48px;
            flex-shrink: 0;
            overflow: visible;
            will-change: transform;
            transform: translateY(-15vh);
            animation: mizuSceneBreathe 10s ease-in-out 5s infinite;
        }

        /* ════════════════════════════════════════════
           ① SVG 水滴
           ★ 尺寸放大 18%: 24×34 → 28×40
           ★ 垂直下移 7%: top 50% → 57%
           ★ 时间线不变 (4s duration, 0.5s delay)
              0.5s~1.0s  淡入 (开场)
              1.0s~4.0s  下落 (3秒)
              4.0s~4.5s  反弹+消散
           ════════════════════════════════════════════ */
        .mizu-drop {
            position: absolute;
            top: 57%;                                    /* ★ 下移: 50% → 57% */
            left: 50%;
            width: 28px;                                 /* ★ 放大: 24 → 28 (+17%) */
            height: 40px;                                /* ★ 放大: 34 → 40 (+18%) */
            margin: -20px 0 0 -14px;                     /* ★ 居中修正: 半宽14 半高20 */
            z-index: 3;
            will-change: transform, opacity;
            opacity: 0;
            transform: translateY(-60px);
            animation: mizuDropLifecycle 4s ease 0.5s forwards;  /* 时间不变 */
        }
        .mizu-drop svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* ════════════════════════════════════════════
           ② 冲击环
           ★ 垂直下移与水滴对齐: top 50% → 57%
           ★ 颜色使用旧水滴色 #b5b5b5
           ★ 延迟 4.0s（水滴触底瞬间）不变
           ════════════════════════════════════════════ */
        .mizu-splash {
            position: absolute;
            top: 57%;                                    /* ★ 下移对齐 */
            left: 50%;
            width: 28px;
            height: 28px;
            margin: -14px 0 0 -14px;
            border: 0.5px solid rgba(181,181,181,.3);    /* ★ 旧水滴色 #b5=181 */
            border-radius: 50%;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            will-change: transform, opacity;
            animation: mizuSplashExpand 1.5s ease-out 4.0s forwards;
        }

        /* ════════════════════════════════════════════
           ③ 波源点
           ★ 垂直下移: top 50% → 57%
           ★ 颜色使用旧水滴色
           ★ 延迟 4.0s 不变
           ════════════════════════════════════════════ */
        .mizu-impact-dot {
            position: absolute;
            top: 57%;                                    /* ★ 下移对齐 */
            left: 50%;
            width: 4px;
            height: 4px;
            margin: -2px 0 0 -2px;
            border-radius: 50%;
            border: 0.5px solid rgba(181,181,181,.25);   /* ★ 旧水滴色 */
            background: none;
            opacity: 0;
            z-index: 2;
            will-change: transform, opacity;
            animation:
                mizuDotAppear  0.8s cubic-bezier(.16,1,.3,1) 4.0s forwards,
                mizuDotBreathe 4s   ease-in-out              5.0s infinite;
        }

        /* ════════════════════════════════════════════
           ④ 涟漪环 — 3 圈
           ★ 垂直下移: top 50% → 57%
           ★ 颜色使用旧水滴色 rgba(181,181,181,.45)
           ★ 延迟 4.0s / 5.3s / 6.6s（触底后依次扩散）不变
           ★ 涟漪覆盖 4.0s → 8.0s = 4 秒 ✓
           ════════════════════════════════════════════ */
        .mizu-ripple {
            position: absolute;
            top: 57%; left: 50%;                         /* ★ 下移对齐 */
            width: 80px; height: 80px;
            margin: -40px 0 0 -40px;
            border: 0.5px solid rgba(181,181,181,.45);   /* ★ 旧水滴色 #b5=181 */
            border-radius: 50%;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
            will-change: transform, opacity;
            animation: mizuRippleExpand 2.5s cubic-bezier(.08,.6,.25,1) forwards;
        }
        /* ★ 涟漪延迟 = 水滴触底时刻 (4.0s) 起依次扩散 */
        .mizu-ripple:nth-child(1) { animation-delay: 4.0s; }  /* 触底即刻 */
        .mizu-ripple:nth-child(2) { animation-delay: 5.3s; }  /* +1.3s */
        .mizu-ripple:nth-child(3) { animation-delay: 6.6s; }  /* +1.3s */

        /* ════════════════════════════════════════════
           品牌文字（★ 保留不变）
           ════════════════════════════════════════════ */
        .mizu-brand {
            font-size: 14px;
            font-weight: 200;
            color: #a0a0a0;
            letter-spacing: 5px;
            text-indent: 5px;
            text-transform: uppercase;
            margin-bottom: 12px;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(16px);
            animation: mizuSlideUp 2s cubic-bezier(.16,1,.3,1) 2s forwards;
        }

        /* ════════════════════════════════════════════
           加载状态文字（★ 保留不变）
           ════════════════════════════════════════════ */
        .mizu-status {
            font-size: 10px;
            font-weight: 300;
            color: #bcbcbc;
            letter-spacing: .8px;
            min-height: 14px;
            margin-bottom: 52px;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(12px);
            animation: mizuSlideUp 1.8s cubic-bezier(.16,1,.3,1) 3.5s forwards;
        }

        /* ════════════════════════════════════════════
           进度条（★ 保留不变）
           ════════════════════════════════════════════ */
        .mizu-progress-track {
            width: 100px;
            height: 1px;
            background: rgba(0,0,0,.04);
            border-radius: .5px;
            overflow: hidden;
            flex-shrink: 0;
            opacity: 0;
            animation: mizuFadeIn 1.5s ease 4s forwards;
        }
        .mizu-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,.04), rgba(0,0,0,.14));
            border-radius: .5px;
            transition: width .8s cubic-bezier(.4,0,.2,1);
        }

        /* ════════════════════════════════════════════
           关键帧 — v14.1（时间线不变，仅颜色/尺寸调整）
           ════════════════════════════════════════════ */

        /* ── 水滴完整生命周期 (4s, delay 0.5s) ──
             0.5s~1.0s  淡入     (开场 1s)
             1.0s~4.0s  下落     (水滴 3s)
             4.0s~4.5s  反弹消散 (进入涟漪期)
           ──────────────────────────────────────── */
        @keyframes mizuDropLifecycle {
            /* Phase 1: 开场淡入 (0~12.5% = 0.5~1.0s) */
            0% {
                opacity: 0;
                transform: translateY(-60px);
                animation-timing-function: ease-out;
            }
            12.5% {
                opacity: .45;                            /* ★ 稍提高可见度配合加深颜色 */
                transform: translateY(-60px);
                animation-timing-function: cubic-bezier(.25, 0, .75, .35);
            }
            /* Phase 2: 重力加速下落 → 触底 (12.5~87.5% = 1.0~4.0s = 3.0s) */
            87.5% {
                opacity: .45;
                transform: translateY(0);
                animation-timing-function: cubic-bezier(.34, 1.56, .64, 1);
            }
            /* Phase 3: 轻微反弹 (87.5~92.5%) */
            92.5% {
                opacity: .35;
                transform: translateY(-5px);
                animation-timing-function: ease-in;
            }
            /* Phase 4: 触水消散 (95~100%) */
            95% {
                opacity: .15;
                transform: translateY(0) scaleX(1.1) scaleY(.85);
                animation-timing-function: ease-out;
            }
            100% {
                opacity: 0;
                transform: translateY(0) scaleX(1.3) scaleY(.3);
            }
        }

        /* ── 冲击环 (1.5s) ── */
        @keyframes mizuSplashExpand {
            from { transform: scale(.35); opacity: .2; }
            to   { transform: scale(3);   opacity: 0; }
        }

        /* ── 波源点浮现 ── */
        @keyframes mizuDotAppear {
            0%   { transform: scale(0);   opacity: 0; }
            50%  { transform: scale(1.3); opacity: .14; }
            100% { transform: scale(1);   opacity: .1; }
        }

        /* ── 波源点呼吸 ── */
        @keyframes mizuDotBreathe {
            0%, 100% { transform: scale(1);   opacity: .1; }
            50%      { transform: scale(1.2); opacity: .04; }
        }

        /* ── ★ 涟漪扩散 (2.5s，单次 forwards) ──
             峰值 opacity 0.38 × border-alpha 0.45 ≈ 可见度 0.17
             整体线条"细淡"但层次分明 */
        @keyframes mizuRippleExpand {
            0%   { transform: scale(.1);  opacity: 0; }
            8%   { opacity: .38; }
            20%  { opacity: .25; }
            40%  { opacity: .14; }
            60%  { opacity: .07; }
            85%  { opacity: .02; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        /* ── 通用（不变） ── */
        @keyframes mizuSlideUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes mizuFadeIn {
            to { opacity: 1; }
        }
        @keyframes mizuShimmerDrift {
            0%   { background-position: 100% 100%; }
            50%  { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* ── 场景呼吸（含 -15vh 偏移，不变） ── */
        @keyframes mizuSceneBreathe {
            0%, 100% { transform: translateY(-15vh) scale(1); }
            50%      { transform: translateY(-15vh) scale(1.018); }
        }

        /* ════════════════════════════════════════════
           退场动画（不变）
           ════════════════════════════════════════════ */
        #loadingIndicator.mizu-fadeout .mizu-scene {
            animation: mizuSceneExit .9s cubic-bezier(.4,0,.15,1) forwards !important;
        }
        @keyframes mizuSceneExit {
            to { transform: translateY(calc(-15vh - 22px)) scale(.88); opacity: 0; }
        }

        #loadingIndicator.mizu-fadeout .mizu-ripple {
            animation-play-state: paused !important;
        }

        #loadingIndicator.mizu-fadeout .mizu-impact-dot {
            animation: none !important;
            opacity: 0 !important;
            transition: opacity .4s ease;
        }

        #loadingIndicator.mizu-fadeout .mizu-brand,
        #loadingIndicator.mizu-fadeout .mizu-status,
        #loadingIndicator.mizu-fadeout .mizu-progress-track {
            animation: mizuContentExit .7s cubic-bezier(.4,0,.15,1) forwards !important;
        }
        @keyframes mizuContentExit {
            to { opacity: 0; transform: translateY(14px); }
        }

        #loadingIndicator.mizu-fadeout .mizu-shimmer {
            opacity: 0 !important;
            transition: opacity .5s ease;
            animation-play-state: paused;
        }
    </style>

    <!-- ★ 超时安全网：20 秒后强制移除 -->
    <script>
        (function() {
            var _loadingTimeout = setTimeout(function() {
                var el = document.getElementById('loadingIndicator');
                if (el) {
                    console.error('[安全网] ⚠️ 超过 20 秒仍在 Loading，强制移除');
                    el.style.display = 'none';
                    if (el.parentNode) el.parentNode.removeChild(el);
                }
                var app = document.getElementById('app');
                if (app) {
                    app.style.visibility = 'visible';
                    app.style.opacity = '1';
                }
                if (typeof nav === 'function') {
                    try { nav('screen-home'); } catch(e) {}
                } else {
                    var home = document.getElementById('screen-home');
                    if (home) {
                        document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
                        home.classList.add('active');
                    }
                }
            }, 20000);
            window.addEventListener('appReady', function() {
                clearTimeout(_loadingTimeout);
            });
        })();
    </script>
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════════════
         ★ Mizu Phone v14.1 — 水滴微调
         ═══════════════════════════════════════════════════════════════ -->
    <div id="loadingIndicator">

        <div class="mizu-shimmer"></div>

        <div class="mizu-scene">

            <span class="mizu-ripple"></span>
            <span class="mizu-ripple"></span>
            <span class="mizu-ripple"></span>

            <div class="mizu-drop">
                <svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">
                    <!-- ★ 主轮廓加深: #b5b5b5 → #ababab -->
                    <path d="M20 5
                             C20 5, 7 28, 7 37
                             C7 45.5, 13 51, 20 51
                             C27 51, 33 45.5, 33 37
                             C33 28, 20 5, 20 5Z"
                          fill="none"
                          stroke="#ababab"
                          stroke-width="0.8"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                    <!-- ★ 高光线加深: #c5c5c5 → #bababa -->
                    <path d="M16.5 27 Q14.5 34, 16.5 40"
                          fill="none"
                          stroke="#bababa"
                          stroke-width="0.4"
                          stroke-linecap="round"/>
                    <!-- ★ 顶部水珠加深: #c8c8c8 → #bcbcbc -->
                    <circle cx="16" cy="22" r="1"
                            fill="none"
                            stroke="#bcbcbc"
                            stroke-width="0.4"/>
                </svg>
            </div>

            <div class="mizu-splash"></div>
            <div class="mizu-impact-dot"></div>

        </div>

        <div class="mizu-brand">Mizu Phone</div>
        <div class="mizu-status" id="mizuStatus"></div>
        <div class="mizu-progress-track">
            <div class="mizu-progress-bar" id="mizuProgress"></div>
        </div>

    </div>

    <div class="app" id="app">
        <div class="screen-container" id="screenContainer"></div>
        <div class="toast" id="toast"></div>
        <div class="snackbar" id="snackbar">
            <span class="snack-text" id="snackbarText"></span>
            <button class="snack-action" id="snackbarAction" style="display:none">Undo</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/screen-loader.js"></script>
</body>

    <style>
        #loadingIndicator {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(
                ellipse at 50% 40%,
                #fcfcfc 0%, #f5f5f5 50%, #ebebeb 100%
            );
            z-index: 99999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter',
                         'Helvetica Neue', system-ui, sans-serif;
            overflow: hidden;
            transition: opacity 1.1s cubic-bezier(.4,0,.15,1),
                        transform 1.1s cubic-bezier(.4,0,.15,1);
        }
        #loadingIndicator.mizu-fadeout {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
        .mizu-shimmer {
            position: absolute;
            inset: -60%;
            background: linear-gradient(
                120deg,
                transparent 38%,
                rgba(255,255,255,.04) 46%,
                rgba(255,255,255,.07) 50%,
                rgba(255,255,255,.04) 54%,
                transparent 62%
            );
            background-size: 200% 200%;
            pointer-events: none;
            opacity: 0;
            will-change: opacity;
            animation:
                mizuFadeIn 4s ease 0.5s forwards,
                mizuShimmerDrift 14s ease-in-out 0.5s infinite;
        }
        .mizu-scene {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 48px;
            flex-shrink: 0;
            overflow: visible;
            will-change: transform;
            transform: translateY(-15vh);
            animation: mizuSceneBreathe 10s ease-in-out 5s infinite;
        }
        .mizu-drop {
            position: absolute;
            top: 57%;
            left: 50%;
            width: 28px;
            height: 40px;
            margin: -20px 0 0 -14px;
            z-index: 3;
            will-change: transform, opacity;
            opacity: 0;
            transform: translateY(-60px);
            animation: mizuDropLifecycle 4s ease 0.5s forwards;
        }
        .mizu-drop svg { width: 100%; height: 100%; overflow: visible; }
        .mizu-splash {
            position: absolute;
            top: 57%;
            left: 50%;
            width: 28px;
            height: 28px;
            margin: -14px 0 0 -14px;
            border: 0.5px solid rgba(181,181,181,.3);
            border-radius: 50%;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            will-change: transform, opacity;
            animation: mizuSplashExpand 1.5s ease-out 4.0s forwards;
        }
        .mizu-impact-dot {
            position: absolute;
            top: 57%;
            left: 50%;
            width: 4px;
            height: 4px;
            margin: -2px 0 0 -2px;
            border-radius: 50%;
            border: 0.5px solid rgba(181,181,181,.25);
            background: none;
            opacity: 0;
            z-index: 2;
            will-change: transform, opacity;
            animation:
                mizuDotAppear  0.8s cubic-bezier(.16,1,.3,1) 4.0s forwards,
                mizuDotBreathe 4s   ease-in-out              5.0s infinite;
        }
        .mizu-ripple {
            position: absolute;
            top: 57%; left: 50%;
            width: 80px; height: 80px;
            margin: -40px 0 0 -40px;
            border: 0.5px solid rgba(181,181,181,.45);
            border-radius: 50%;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
            will-change: transform, opacity;
            animation: mizuRippleExpand 2.5s cubic-bezier(.08,.6,.25,1) forwards;
        }
        .mizu-ripple:nth-child(1) { animation-delay: 4.0s; }
        .mizu-ripple:nth-child(2) { animation-delay: 5.3s; }
        .mizu-ripple:nth-child(3) { animation-delay: 6.6s; }
        .mizu-brand {
            font-size: 14px;
            font-weight: 200;
            color: #a0a0a0;
            letter-spacing: 5px;
            text-indent: 5px;
            text-transform: uppercase;
            margin-bottom: 12px;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(16px);
            animation: mizuSlideUp 2s cubic-bezier(.16,1,.3,1) 2s forwards;
        }
        .mizu-status {
            font-size: 10px;
            font-weight: 300;
            color: #bcbcbc;
            letter-spacing: .8px;
            min-height: 14px;
            margin-bottom: 52px;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(12px);
            animation: mizuSlideUp 1.8s cubic-bezier(.16,1,.3,1) 3.5s forwards;
        }
        .mizu-progress-track {
            width: 100px;
            height: 1px;
            background: rgba(0,0,0,.04);
            border-radius: .5px;
            overflow: hidden;
            flex-shrink: 0;
            opacity: 0;
            animation: mizuFadeIn 1.5s ease 4s forwards;
        }
        .mizu-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,.04), rgba(0,0,0,.14));
            border-radius: .5px;
            transition: width .8s cubic-bezier(.4,0,.2,1);
        }
        @keyframes mizuDropLifecycle {
            0%    { opacity: 0; transform: translateY(-60px); animation-timing-function: ease-out; }
            12.5% { opacity: .45; transform: translateY(-60px); animation-timing-function: cubic-bezier(.25,0,.75,.35); }
            87.5% { opacity: .45; transform: translateY(0); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
            92.5% { opacity: .35; transform: translateY(-5px); animation-timing-function: ease-in; }
            95%   { opacity: .15; transform: translateY(0) scaleX(1.1) scaleY(.85); animation-timing-function: ease-out; }
            100%  { opacity: 0; transform: translateY(0) scaleX(1.3) scaleY(.3); }
        }
        @keyframes mizuSplashExpand { from { transform: scale(.35); opacity: .2; } to { transform: scale(3); opacity: 0; } }
        @keyframes mizuDotAppear { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.3); opacity: .14; } 100% { transform: scale(1); opacity: .1; } }
        @keyframes mizuDotBreathe { 0%,100% { transform: scale(1); opacity: .1; } 50% { transform: scale(1.2); opacity: .04; } }
        @keyframes mizuRippleExpand { 0% { transform: scale(.1); opacity: 0; } 8% { opacity: .38; } 20% { opacity: .25; } 40% { opacity: .14; } 60% { opacity: .07; } 85% { opacity: .02; } 100% { transform: scale(3.5); opacity: 0; } }
        @keyframes mizuSlideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes mizuFadeIn { to { opacity: 1; } }
        @keyframes mizuShimmerDrift { 0% { background-position: 100% 100%; } 50% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }
        @keyframes mizuSceneBreathe { 0%,100% { transform: translateY(-15vh) scale(1); } 50% { transform: translateY(-15vh) scale(1.018); } }
        #loadingIndicator.mizu-fadeout .mizu-scene { animation: mizuSceneExit .9s cubic-bezier(.4,0,.15,1) forwards !important; }
        @keyframes mizuSceneExit { to { transform: translateY(calc(-15vh - 22px)) scale(.88); opacity: 0; } }
        #loadingIndicator.mizu-fadeout .mizu-ripple { animation-play-state: paused !important; }
        #loadingIndicator.mizu-fadeout .mizu-impact-dot { animation: none !important; opacity: 0 !important; transition: opacity .4s ease; }
        #loadingIndicator.mizu-fadeout .mizu-brand,
        #loadingIndicator.mizu-fadeout .mizu-status,
        #loadingIndicator.mizu-fadeout .mizu-progress-track { animation: mizuContentExit .7s cubic-bezier(.4,0,.15,1) forwards !important; }
        @keyframes mizuContentExit { to { opacity: 0; transform: translateY(14px); } }
        #loadingIndicator.mizu-fadeout .mizu-shimmer { opacity: 0 !important; transition: opacity .5s ease; animation-play-state: paused; }
    </style>

    <script>
        (function() {
            var _loadingTimeout = setTimeout(function() {
                if (window.__authRequired) {
                    var el = document.getElementById('loadingIndicator');
                    if (el && el.style.display !== 'none') {
                        el.classList.add('mizu-fadeout');
                        setTimeout(function() { el.style.display = 'none'; }, 1200);
                    }
                    return;
                }
                var el = document.getElementById('loadingIndicator');
                if (el) {
                    console.error('[安全网] 超过 20 秒仍在 Loading，强制移除');
                    el.style.display = 'none';
                    if (el.parentNode) el.parentNode.removeChild(el);
                }
                var app = document.getElementById('app');
                if (app) {
                    app.style.visibility = 'visible';
                    app.style.opacity = '1';
                }
                if (typeof nav === 'function') {
                    try { nav('screen-home'); } catch(e) {}
                } else {
                    var home = document.getElementById('screen-home');
                    if (home) {
                        document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
                        home.classList.add('active');
                    }
                }
            }, 20000);
            window.addEventListener('appReady', function() {
                clearTimeout(_loadingTimeout);
            });
        })();
    </script>
</head>
<body>

    <!-- Loading Indicator -->
    <div id="loadingIndicator">
        <div class="mizu-shimmer"></div>
        <div class="mizu-scene">
            <span class="mizu-ripple"></span>
            <span class="mizu-ripple"></span>
            <span class="mizu-ripple"></span>
            <div class="mizu-drop">
                <svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 5 C20 5, 7 28, 7 37 C7 45.5, 13 51, 20 51 C27 51, 33 45.5, 33 37 C33 28, 20 5, 20 5Z"
                          fill="none" stroke="#ababab" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16.5 27 Q14.5 34, 16.5 40" fill="none" stroke="#bababa" stroke-width="0.4" stroke-linecap="round"/>
                    <circle cx="16" cy="22" r="1" fill="none" stroke="#bcbcbc" stroke-width="0.4"/>
                </svg>
            </div>
            <div class="mizu-splash"></div>
            <div class="mizu-impact-dot"></div>
        </div>
        <div class="mizu-brand">Mizu Phone</div>
        <div class="mizu-status" id="mizuStatus"></div>
        <div class="mizu-progress-track">
            <div class="mizu-progress-bar" id="mizuProgress"></div>
        </div>
    </div>

    <!-- ★ 认证界面 -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-container">

            <div class="auth-logo">
                <svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 5 C20 5, 7 28, 7 37 C7 45.5, 13 51, 20 51 C27 51, 33 45.5, 33 37 C33 28, 20 5, 20 5Z"
                          fill="none" stroke="#ababab" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16.5 27 Q14.5 34, 16.5 40" fill="none" stroke="#bababa" stroke-width="0.4" stroke-linecap="round"/>
                    <circle cx="16" cy="22" r="1" fill="none" stroke="#bcbcbc" stroke-width="0.4"/>
                </svg>
            </div>
            <div class="auth-brand">Mizu Phone</div>

            <h2 id="authTitle" class="auth-title">登录</h2>

            <div id="authError" class="auth-error"></div>

            <!-- 登录表单 -->
            <div id="authLoginForm" class="auth-form">
                <div class="auth-field">
                    <label>QQ 号</label>
                    <input type="text" id="loginQQ" inputmode="numeric" pattern="[0-9]*"
                           placeholder="输入 QQ 号" autocomplete="username">
                </div>
                <div class="auth-field">
                    <label>密码</label>
                    <div class="auth-pwd-wrap">
                        <input type="password" id="loginPassword"
                               placeholder="输入密码" autocomplete="current-password">
                        <button type="button" class="auth-pwd-toggle" data-target="loginPassword">
                            <svg class="pwd-icon-show" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.5"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="pwd-icon-hide" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.5"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button id="authLoginBtn" class="auth-submit-btn" type="button">登录</button>
                <div class="auth-switch">
                    没有账号？<a href="#" id="switchToRegister">去注册</a>
                </div>
            </div>

            <!-- 注册表单 -->
            <div id="authRegisterForm" class="auth-form" style="display:none">
                <div class="auth-field">
                    <label>QQ 号</label>
                    <input type="text" id="regQQ" inputmode="numeric" pattern="[0-9]*"
                           placeholder="输入 QQ 号（纯数字）" autocomplete="username">
                </div>
                <div class="auth-field">
                    <label>用户名</label>
                    <input type="text" id="regName"
                           placeholder="输入显示名称" autocomplete="name">
                </div>
                <div class="auth-field">
                    <label>密码</label>
                    <div class="auth-pwd-wrap">
                        <input type="password" id="regPassword"
                               placeholder="至少 6 位" autocomplete="new-password">
                        <button type="button" class="auth-pwd-toggle" data-target="regPassword">
                            <svg class="pwd-icon-show" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.5"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="pwd-icon-hide" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.5"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="auth-field">
                    <label>确认密码</label>
                    <div class="auth-pwd-wrap">
                        <input type="password" id="regPasswordConfirm"
                               placeholder="再次输入密码" autocomplete="new-password">
                        <button type="button" class="auth-pwd-toggle" data-target="regPasswordConfirm">
                            <svg class="pwd-icon-show" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.5"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="pwd-icon-hide" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.5"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button id="authRegisterBtn" class="auth-submit-btn" type="button">注册</button>
                <div class="auth-switch">
                    已有账号？<a href="#" id="switchToLogin">去登录</a>
                </div>
            </div>

        </div>
    </div>

    <!-- 主应用 -->
    <div class="app" id="app">
        <div class="screen-container" id="screenContainer"></div>
        <div class="toast" id="toast"></div>
        <div class="snackbar" id="snackbar">
            <span class="snack-text" id="snackbarText"></span>
            <button class="snack-action" id="snackbarAction" style="display:none">Undo</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/screen-loader.js"></script>
</body>
